<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Aakaara Studios</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --noir: #09080b; --umber: #1e1a16; --ivory: #faf6f1;
            --rose: #c9956b; --rose-light: #dbb08a;
            --sage: #8a9a7e; --wine: #7a3b4e;
            --font-display: 'Cormorant Garamond', serif;
            --font-body: 'Outfit', sans-serif;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }
        body {
            background: var(--noir); color: var(--ivory);
            font-family: var(--font-body); font-weight: 300;
            margin: 0; -webkit-font-smoothing: antialiased;
        }
        .dashboard-header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid rgba(201,149,107,0.1);
            display: flex; justify-content: space-between; align-items: center;
        }
        .dashboard-header h1 {
            font-family: var(--font-display); font-weight: 300;
            font-size: 1.4rem; letter-spacing: 0.1em; margin: 0;
        }
        .dashboard-header .brand {
            font-size: 0.6rem; letter-spacing: 0.3em; text-transform: uppercase;
            color: var(--rose);
        }
        .header-nav-links {
            display: flex;
            gap: 1.5rem;
        }
        .header-nav-links a {
            color: rgba(250,246,241,0.4);
            font-size: 0.8rem;
            text-decoration: none;
            transition: color 0.3s;
        }
        .header-nav-links a:hover { color: var(--rose); }
        .container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            padding: 2rem;
            align-items: flex-start;
        }
        .section {
            background: rgba(30,26,22,0.2);
            border: 1px solid rgba(201,149,107,0.08);
            border-radius: 8px;
        }
        .section-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(201,149,107,0.1);
            font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase;
            color: var(--rose);
        }
        .section-body { padding: 1.5rem; }

        /* Quote Table */
        .quote-table { width: 100%; border-collapse: collapse; }
        .quote-table th, .quote-table td {
            padding: 0.8rem 0.5rem; text-align: left;
            font-size: 0.8rem; border-bottom: 1px solid rgba(201,149,107,0.05);
        }
        .quote-table th {
            font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase;
            color: rgba(250,246,241,0.4); font-weight: 400;
        }
        .quote-table td:first-child { padding-left: 1.5rem; }
        .quote-table td:last-child { padding-right: 1.5rem; }
        .quote-table tr:last-child td { border-bottom: none; }

        .status-select {
            background: transparent; border: 1px solid transparent;
            color: var(--ivory); font-family: inherit; font-size: inherit;
            padding: 0.3rem 0.5rem; border-radius: 4px;
            cursor: pointer;
        }
        .status-select:focus { outline: none; border-color: var(--rose); }
        .status-select option { background: var(--umber); }

        .status-badge {
            padding: 0.2rem 0.6rem; border-radius: 10px; font-size: 0.7rem;
            letter-spacing: 0.05em;
        }
        .status-badge.sent { background: rgba(224,164,88,0.2); color: #e0a458; }
        .status-badge.confirmed { background: rgba(138,154,126,0.2); color: #a8b8a0; }
        .status-badge.rejected { background: rgba(122,59,78,0.2); color: #c28ca0; }

        .price-input {
            background: rgba(0,0,0,0.2); border: 1px solid rgba(250,246,241,0.1);
            color: var(--ivory); padding: 0.3rem 0.5rem; border-radius: 4px;
            font-family: inherit; font-size: inherit; width: 80px;
        }

        /* Calendar */
        .calendar-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1rem;
        }
        .calendar-header button {
            background: none; border: 1px solid rgba(201,149,107,0.2);
            color: var(--rose); border-radius: 50%;
            width: 28px; height: 28px; cursor: pointer; transition: all 0.2s;
        }
        .calendar-header button:hover { background: rgba(201,149,107,0.1); }
        #calendarMonthYear { font-size: 1rem; font-weight: 400; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .calendar-day, .calendar-weekday {
            height: 40px; display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem;
        }
        .calendar-weekday {
            font-size: 0.6rem; text-transform: uppercase; color: rgba(250,246,241,0.3);
        }
        .calendar-day.other-month { color: rgba(250,246,241,0.2); }
        .calendar-day.occupied {
            background: rgba(138,154,126,0.2);
            color: #a8b8a0;
            border-radius: 4px;
            position: relative;
            cursor: help;
        }
        .calendar-day.pending {
            background: rgba(224,164,88,0.1);
            border: 1px solid rgba(224,164,88,0.2);
            color: #e0a458;
            border-radius: 4px;
            position: relative;
            cursor: help;
        }
        .calendar-day .tooltip {
            display: none;
            position: absolute;
            bottom: 110%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--umber);
            padding: 0.5rem 0.8rem;
            border-radius: 4px;
            font-size: 0.75rem;
            white-space: nowrap;
            z-index: 10;
            border: 1px solid rgba(201,149,107,0.2);
        }
        .calendar-day.occupied:hover .tooltip,
        .calendar-day.pending:hover .tooltip { display: block; }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header class="dashboard-header">
        <div>
            <div class="brand">Aakaara Studios</div>
            <h1>Quote Dashboard</h1>
        </div>
        <div class="header-nav-links">
            <a href="quote-generator.html">‹ Quote Generator</a>
            <a href="index.html">Main Site ›</a>
        </div>
    </header>

    <main class="container">
        <div class="section">
            <div class="section-header">Active Quotes</div>
            <div style="overflow-x: auto;">
                <table class="quote-table" id="quoteTable">
                    <thead>
                        <tr>
                            <th>Client</th>
                            <th>Event Date</th>
                            <th>Status</th>
                            <th>Quoted</th>
                            <th>Confirmed Price</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- JS will render rows here -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="section">
            <div class="section-header">Availability Calendar</div>
            <div class="section-body">
                <div class="calendar-header">
                    <button id="prevMonth">‹</button>
                    <div id="calendarMonthYear"></div>
                    <button id="nextMonth">›</button>
                </div>
                <div class="calendar-grid" id="calendarWeekdays"></div>
                <div class="calendar-grid" id="calendarDays"></div>
            </div>
        </div>
    </main>

<script>
document.addEventListener('DOMContentLoaded', function() {

    // --- 1. DATA MANAGEMENT ---
    // Load from localStorage or use mock data as a fallback.
    let quotes = [];
    const storedQuotes = localStorage.getItem('aakaaraQuotes');

    if (storedQuotes) {
        quotes = JSON.parse(storedQuotes);
    } else {
        // Fallback to mock data if nothing is stored, then save it.
        quotes = [
            { id: 1, clientName: 'Priya & Rohan', eventDate: '2024-09-14', eventDateTo: '2024-09-15', status: 'sent', quotedPrice: 4500, confirmedPrice: null },
            { id: 2, clientName: 'Ananya Sharma', eventDate: '2024-10-05', eventDateTo: '2024-10-05', status: 'confirmed', quotedPrice: 2200, confirmedPrice: 2200 },
            { id: 3, clientName: 'Vikram Singh', eventDate: '2024-09-21', eventDateTo: '2024-09-21', status: 'sent', quotedPrice: 3000, confirmedPrice: null },
            { id: 4, clientName: 'Meera Desai', eventDate: '2024-11-02', eventDateTo: '2024-11-02', status: 'rejected', quotedPrice: 1800, confirmedPrice: null },
            { id: 5, clientName: 'Arjun & Diya', eventDate: '2024-10-06', eventDateTo: '2024-10-06', status: 'confirmed', quotedPrice: 7500, confirmedPrice: 7000 },
        ];
        localStorage.setItem('aakaaraQuotes', JSON.stringify(quotes));
    }

    // Function to save all quotes back to localStorage
    function saveQuotes() {
        localStorage.setItem('aakaaraQuotes', JSON.stringify(quotes));
    }
    const quoteTableBody = document.querySelector('#quoteTable tbody');
    let currentDate = new Date();

    // --- 2. RENDER FUNCTIONS ---

    function renderQuotes() {
        quoteTableBody.innerHTML = '';
        quotes.forEach(quote => {
            const row = document.createElement('tr');

            const statusOptions = `
                <option value="sent" ${quote.status === 'sent' ? 'selected' : ''}>Sent</option>
                <option value="confirmed" ${quote.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
                <option value="rejected" ${quote.status === 'rejected' ? 'selected' : ''}>Rejected</option>
            `;

            const confirmedPriceInput = `
                <input 
                    type="number" 
                    class="price-input" 
                    value="${quote.confirmedPrice || ''}" 
                    ${quote.status !== 'confirmed' ? 'disabled' : ''}
                    data-id="${quote.id}"
                />`;

            let dateDisplay = new Date(quote.eventDate + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            if (quote.eventDateTo && quote.eventDateTo !== quote.eventDate) {
                const dateToDisplay = new Date(quote.eventDateTo + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                dateDisplay += ` to ${dateToDisplay}`;
            }

            row.innerHTML = `
                <td>${quote.clientName}</td>
                <td>${dateDisplay}</td>
                <td>
                    <select class="status-select" data-id="${quote.id}">
                        ${statusOptions}
                    </select>
                </td>
                <td>$${quote.quotedPrice.toLocaleString()}</td>
                <td>${confirmedPriceInput}</td>
            `;

            // Apply styling based on status
            const select = row.querySelector('.status-select');
            styleStatus(select, quote.status);

            quoteTableBody.appendChild(row);
        });

        addEventListeners();
        renderCalendar(); // Re-render calendar when quotes change
    }

    function renderCalendar() {
        const calendarDays = document.getElementById('calendarDays');
        const calendarMonthYear = document.getElementById('calendarMonthYear');
        const calendarWeekdays = document.getElementById('calendarWeekdays');
        calendarDays.innerHTML = '';
        calendarWeekdays.innerHTML = '';

        const month = currentDate.getMonth();
        const year = currentDate.getFullYear();

        calendarMonthYear.textContent = `${currentDate.toLocaleString('default', { month: 'long' })} ${year}`;

        // Get all events and populate a map of dates, handling ranges
        const eventsByDate = {};
        quotes.forEach(q => {
            if (q.status === 'rejected' || !q.eventDate) return;

            const startDate = new Date(q.eventDate + 'T00:00:00');
            const endDate = q.eventDateTo ? new Date(q.eventDateTo + 'T00:00:00') : startDate;

            // Loop from start to end date
            for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                const dateString = d.toISOString().split('T')[0];

                // If a date already has a confirmed event, don't overwrite it with a pending one
                if (eventsByDate[dateString] && eventsByDate[dateString].status === 'confirmed' && q.status !== 'confirmed') {
                    continue;
                }
            
                eventsByDate[dateString] = { clientName: q.clientName, status: q.status };
            }
        });

        // Render weekdays
        const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        weekdays.forEach(day => {
            calendarWeekdays.innerHTML += `<div class="calendar-weekday">${day}</div>`;
        });

        const firstDayOfMonth = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        // Add blank days for the start of the month
        for (let i = 0; i < firstDayOfMonth; i++) {
            calendarDays.innerHTML += `<div class="calendar-day"></div>`;
        }

        // Add days of the month
        for (let i = 1; i <= daysInMonth; i++) {
            const dayEl = document.createElement('div');
            dayEl.classList.add('calendar-day');
            dayEl.textContent = i;

            const dateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
            const event = eventsByDate[dateString];

            if (event) {
                if (event.status === 'confirmed') {
                    dayEl.classList.add('occupied');
                    dayEl.innerHTML += `<div class="tooltip">Occupied: ${event.clientName}</div>`;
                } else if (event.status === 'sent') {
                    dayEl.classList.add('pending');
                    dayEl.innerHTML += `<div class="tooltip">Pending: ${event.clientName}</div>`;
                }
            }
            
            calendarDays.appendChild(dayEl);
        }
    }

    // --- 3. EVENT HANDLING ---

    function addEventListeners() {
        // Status change
        document.querySelectorAll('.status-select').forEach(select => {
            select.addEventListener('change', (e) => {
                const quoteId = parseInt(e.target.dataset.id);
                const newStatus = e.target.value;
                
                const quote = quotes.find(q => q.id === quoteId);
                if (quote) {
                    quote.status = newStatus;
                    saveQuotes(); // Save changes to localStorage
                    renderQuotes(); // Re-render to update UI
                }
            });
        });

        // Confirmed price change
        document.querySelectorAll('.price-input').forEach(input => {
            input.addEventListener('change', (e) => {
                const quoteId = parseInt(e.target.dataset.id);
                const newPrice = parseFloat(e.target.value);

                const quote = quotes.find(q => q.id === quoteId);
                if (quote && !isNaN(newPrice)) {
                    quote.confirmedPrice = newPrice;
                    saveQuotes(); // Save changes to localStorage
                }
            });
        });
    }

    function styleStatus(selectElement, status) {
        selectElement.className = 'status-select'; // Reset
        switch (status) {
            case 'sent':
                selectElement.style.color = '#e0a458';
                selectElement.style.backgroundColor = 'rgba(224,164,88,0.1)';
                break;
            case 'confirmed':
                selectElement.style.color = '#a8b8a0';
                selectElement.style.backgroundColor = 'rgba(138,154,126,0.1)';
                break;
            case 'rejected':
                selectElement.style.color = '#c28ca0';
                selectElement.style.backgroundColor = 'rgba(122,59,78,0.1)';
                break;
        }
    }

    // Calendar navigation
    document.getElementById('prevMonth').addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar();
    });


    // --- 4. INITIAL RENDER ---
    renderQuotes();

});
</script>

</body>
</html>
