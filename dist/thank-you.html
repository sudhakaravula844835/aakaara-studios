  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You — Aakaara Studios NYC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      color: var(--ivory);
    }
    .thank-you-container {
      max-width: 550px;
      padding: 2rem;
      opacity: 0;
      animation: fadeIn 1.2s var(--ease) 0.3s forwards;
    }
    .thank-you-title {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: clamp(2rem, 5vw, 2.8rem);
      letter-spacing: 0.04em;
      line-height: 1.2;
      margin-bottom: 1rem;
    }
    .thank-you-message {
      font-size: 0.9rem;
      color: rgba(250,246,241,0.5);
      line-height: 1.8;
      margin-bottom: 2.5rem;
    }
    .thank-you-link {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ivory);
      border: 1px solid rgba(201,149,107,0.35);
      padding: 0.8rem 1.8rem;
      transition: all 0.4s;
    }
    .thank-you-link:hover {
      background: var(--rose);
      border-color: var(--rose);
      color: var(--noir);
    }
  </style>
</head>
<body>
  <div class="thank-you-container">
    <div class="section-tag">Message Sent</div>
    <h1 class="thank-you-title">Thank You for Reaching Out</h1>
    <p class="thank-you-message">Your message has been successfully sent. We appreciate you considering Aakaara Studios and will be in touch within 24 hours to discuss how we can bring your story to life.</p>
    <a href="index.html" class="thank-you-link">Return to Homepage</a>
  </div>
</body>
</html>
