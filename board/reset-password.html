<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Your Password — Project Board — Aakaara Studios</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="board.css">
</head>
<body class="login-body">
  <div class="login-box">
    <div class="brand">Aakaara Studios</div>
    <h1 id="resetTitle">Set Your Password</h1>
    <p class="login-status" id="resetIntro">Verifying your link…</p>

    <form id="resetForm" novalidate hidden>
      <div class="form-group">
        <label class="form-label" for="rPassword">New password</label>
        <input class="form-input" type="password" id="rPassword" required autocomplete="new-password" minlength="8">
      </div>
      <div class="form-group">
        <label class="form-label" for="rPasswordConfirm">Confirm password</label>
        <input class="form-input" type="password" id="rPasswordConfirm" required autocomplete="new-password" minlength="8">
      </div>
      <div class="login-error" id="resetError"></div>
      <button type="submit" class="btn-modal-save login-submit">Set Password &amp; Continue</button>
    </form>

    <a class="login-link" id="backToLogin" href="login.html" hidden>Back to log in</a>
  </div>
<script type="module" src="reset-password.js"></script>
</body>
</html>
