<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aakaara Spatial Gallery Study</title>
  <style>
    :root {
      --bg: #050404;
      --text: #f5eee8;
      --muted: rgba(245, 238, 232, 0.55);
      --accent: #c9956b;
      --line: rgba(201, 149, 107, 0.25);
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      overflow: auto;
      background:
        radial-gradient(circle at 58% 56%, rgba(196, 140, 89, 0.1), transparent 26%),
        radial-gradient(circle at 30% 22%, rgba(130, 86, 64, 0.08), transparent 22%),
        linear-gradient(180deg, #090707 0%, #050404 100%);
      color: var(--text);
      font-family: "Cormorant Garamond", Georgia, serif;
    }

    .study {
      position: relative;
      height: 100vh;
      isolation: isolate;
    }

    .study::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.38), transparent 22%, transparent 80%, rgba(0, 0, 0, 0.38)),
        radial-gradient(circle at center, rgba(255, 255, 255, 0.02), transparent 58%);
      pointer-events: none;
      z-index: 0;
    }

    .study-head {
      position: relative;
      z-index: 5;
      display: grid;
      gap: 0.65rem;
      pointer-events: none;
      max-width: 36rem;
      padding: 2rem 1.5rem 0;
    }

    .study-kicker {
      font-family: Arial, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.42);
    }

    .study-head h1 {
      font-size: clamp(2.6rem, 4.2vw, 4.8rem);
      letter-spacing: -0.045em;
      line-height: 0.94;
      font-weight: 500;
      max-width: 10ch;
    }

    .study-head h1 em {
      color: var(--accent);
      font-style: italic;
      font-weight: 400;
    }

    .study-meta {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 0.9rem;
      font-family: Arial, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.34);
      pointer-events: none;
      max-width: 36rem;
      padding: 0 1.5rem 2rem;
    }

    .study-meta::before {
      content: "";
      width: 2.6rem;
      height: 1px;
      background: var(--line);
    }

    .gallery-stage {
      position: absolute;
      inset: 0;
      z-index: 1;
      perspective: 1900px;
      perspective-origin: 50% 48%;
      pointer-events: none;
    }

    .helix-field {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .gallery-card {
      position: absolute;
      width: 28rem;
      aspect-ratio: 1.42;
      top: 50%;
      left: 50%;
      margin-top: -9.86rem;
      margin-left: -14rem;
      overflow: hidden;
      border-radius: 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background-color: #110d0c;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      box-shadow: 0 40px 90px rgba(0, 0, 0, 0.28);
      will-change: transform, opacity;
    }

    .gallery-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(11, 8, 8, 0.05) 8%, rgba(11, 8, 8, 0.16) 42%, rgba(11, 8, 8, 0.52) 100%),
        radial-gradient(circle at 50% 16%, rgba(255, 255, 255, 0.14), transparent 38%);
      pointer-events: none;
      z-index: 0;
    }

    .gallery-card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      pointer-events: none;
      z-index: 2;
    }

    .gallery-card__copy {
      position: absolute;
      left: 1.35rem;
      right: 1.35rem;
      bottom: 1.2rem;
      z-index: 1;
      display: grid;
      gap: 0.3rem;
    }

    .gallery-card__eyebrow {
      font-family: Arial, sans-serif;
      font-size: 0.64rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(201, 149, 107, 0.82);
    }

    .gallery-card__title {
      font-size: clamp(1.1rem, 1.45vw, 1.7rem);
      line-height: 0.92;
      letter-spacing: -0.04em;
      font-weight: 500;
    }

    .gallery-card__subtitle {
      font-family: Arial, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.56);
    }

    .gallery-card__shine {
      position: absolute;
      inset: 0;
      background: linear-gradient(var(--shine-angle, 115deg), transparent 30%, rgba(255, 255, 255, 0.12) 50%, transparent 72%);
      mix-blend-mode: screen;
      opacity: 0;
      transition: opacity 220ms ease;
      z-index: 1;
      pointer-events: none;
    }

    .gallery-card.is-hovered {
      border-color: rgba(255, 255, 255, 0.16);
      box-shadow: 0 52px 100px rgba(0, 0, 0, 0.34);
    }

    .gallery-card.is-hovered .gallery-card__shine {
      opacity: 1;
    }

  </style>
</head>
<body>
  <main class="study">
    <header class="study-head">
      <p class="study-kicker">Spatial Gallery Study</p>
      <h1><em>Aakaara</em> in cinematic orbit.</h1>
    </header>

    <section class="gallery-stage" aria-label="3D spatial gallery study">
      <div class="helix-field" id="helixField">
        <article class="gallery-card is-wide"
          style="--i:0; --depth:0.0; background-image: linear-gradient(180deg, rgba(12,8,8,0.02), rgba(12,8,8,0.32)), url('/images/couple-portraits/karthik-sowmya/1.jpg')">
          <div class="gallery-card__shine"></div>
          <div class="gallery-card__copy">
            <p class="gallery-card__eyebrow">Frame 01</p>
            <h3 class="gallery-card__title">Weddings</h3>
            <p class="gallery-card__subtitle">Grandeur in motion</p>
          </div>
        </article>

        <article class="gallery-card is-tall"
          style="--i:1; --depth:0.2; background-image: linear-gradient(180deg, rgba(12,8,8,0.03), rgba(12,8,8,0.32)), url('/images/couple-portraits/anusha-akshay/2.jpg')">
          <div class="gallery-card__shine"></div>
          <div class="gallery-card__copy">
            <p class="gallery-card__eyebrow">Frame 02</p>
            <h3 class="gallery-card__title">Portraits</h3>
            <p class="gallery-card__subtitle">Soft contrast, held close</p>
          </div>
        </article>

        <article class="gallery-card is-small"
          style="--i:2; --depth:0.4; background-image: linear-gradient(180deg, rgba(12,8,8,0.04), rgba(12,8,8,0.42)), url('/images/couple-portraits/sripad-ritika/2.jpg')">
          <div class="gallery-card__shine"></div>
          <div class="gallery-card__copy">
            <p class="gallery-card__eyebrow">Frame 03</p>
            <h3 class="gallery-card__title">Films</h3>
            <p class="gallery-card__subtitle">Motion after dusk</p>
          </div>
        </article>

        <article class="gallery-card is-medium"
          style="--i:3; --depth:0.6; background-image: linear-gradient(180deg, rgba(12,8,8,0.03), rgba(12,8,8,0.36)), url('/images/couple-portraits/sameeksha-aman/5.jpg')">
          <div class="gallery-card__shine"></div>
          <div class="gallery-card__copy">
            <p class="gallery-card__eyebrow">Frame 04</p>
            <h3 class="gallery-card__title">Editorial</h3>
            <p class="gallery-card__subtitle">Quiet cinematic rhythm</p>
          </div>
        </article>

        <article class="gallery-card is-small"
          style="--i:4; --depth:0.8; background-image: linear-gradient(180deg, rgba(12,8,8,0.05), rgba(12,8,8,0.42)), url('/images/couple-portraits/yogesh-supritha/3.jpg')">
          <div class="gallery-card__shine"></div>
          <div class="gallery-card__copy">
            <p class="gallery-card__eyebrow">Frame 05</p>
            <h3 class="gallery-card__title">Couples</h3>
            <p class="gallery-card__subtitle">Held in warmth</p>
          </div>
        </article>
      </div>
    </section>

    <div class="study-meta">Scroll to explore</div>
  </main>
<script>
(function () {
  'use strict';

  /* ─── Slot positions ──────────────────────────────────────────────
     9 slots: −4 (upper-left past) → 0 (featured centre) → +4 (lower-right future).
     Array index = slotOffset + 4.
     tx  : lateral offset in vw  (positive = right)
     ty  : vertical offset in %  (of card's own height, positive = down)
     tz  : depth in px (negative = further from viewer)
     ry  : Y-axis rotation in degrees
     sc  : scale
     op  : opacity
  ──────────────────────────────────────────────────────────────── */
  var SLOTS = [
    { tx:   2, ty: -230, tz:  -850, ry: -165, sc: 0.70, op: 0.30 }, // −4
    { tx: -24, ty: -200, tz: -1400, ry: -140, sc: 0.75, op: 0.42 }, // −3
    { tx: -47, ty: -175, tz: -1680, ry: -110, sc: 0.82, op: 0.55 }, // −2
    { tx: -30, ty:  -65, tz:  -500, ry:  -55, sc: 0.88, op: 0.78 }, // −1
    { tx:   0, ty:  -25, tz:     0, ry:    0, sc: 1.18, op: 1.00 }, //  0 FEATURED
    { tx:  30, ty:   15, tz:  -500, ry:   55, sc: 0.88, op: 0.78 }, // +1
    { tx:  47, ty:  125, tz: -1680, ry:  110, sc: 0.82, op: 0.55 }, // +2
    { tx:  24, ty:  150, tz: -1400, ry:  140, sc: 0.75, op: 0.42 }, // +3
    { tx:  -2, ty:  180, tz:  -850, ry:  165, sc: 0.70, op: 0.30 }, // +4
  ];

  /* ─── Helpers ─────────────────────────────────────────────────── */
  function lerp(a, b, t) { return a + (b - a) * t; }

  function slotProps(slotOffset) {
    var clamped = Math.max(-4, Math.min(4, slotOffset));
    var idx     = clamped + 4;          // 0–8
    var lo      = Math.floor(idx);
    var hi      = Math.min(8, lo + 1);
    var t       = idx - lo;
    var A = SLOTS[lo], B = SLOTS[hi];
    return {
      tx: lerp(A.tx, B.tx, t),
      ty: lerp(A.ty, B.ty, t),
      tz: lerp(A.tz, B.tz, t),
      ry: lerp(A.ry, B.ry, t),
      sc: lerp(A.sc, B.sc, t),
      op: lerp(A.op, B.op, t),
    };
  }

  function buildTransform(p) {
    return (
      'translateX(' + p.tx.toFixed(2) + 'vw) ' +
      'translateY(' + p.ty.toFixed(2) + '%) ' +
      'translateZ(' + p.tz.toFixed(0) + 'px) ' +
      'rotateY('    + p.ry.toFixed(1) + 'deg) ' +
      'scale('      + p.sc.toFixed(4) + ')'
    );
  }

  /* ─── DOM refs ────────────────────────────────────────────────── */
  var field = document.getElementById('helixField');
  var cards = Array.prototype.slice.call(
    field.querySelectorAll('.gallery-card')
  );
  var NUM_CARDS    = cards.length;   // 5
  var MAX_PROGRESS = NUM_CARDS - 1;  // 4

  /* ─── Progress state ─────────────────────────────────────────── */
  var SENSITIVITY    = 0.005;   // deltaY of 200 → advance 1 card
  var targetProgress = 0;
  var lerpedProgress = 0;
  var scrollLocked   = true;    // true = hijack active

  /* ─── Render ──────────────────────────────────────────────────── */
  function applyFrame() {
    cards.forEach(function (card, i) {
      var offset = i - lerpedProgress;
      var p      = slotProps(offset);
      card.style.transform = buildTransform(p);
      card.style.opacity   = p.op.toFixed(3);
      card.style.zIndex    = String(Math.round(10 - Math.abs(offset)));
    });
  }

  var rafId = null;
  function tick() {
    if (Math.abs(targetProgress - lerpedProgress) > 0.0001) {
      lerpedProgress += (targetProgress - lerpedProgress) * 0.07;
      applyFrame();
    }
    rafId = requestAnimationFrame(tick);
  }

  /* ─── Scroll hijack ───────────────────────────────────────────── */
  window.addEventListener('wheel', function (e) {
    var dy = e.deltaMode === 1 ? e.deltaY * 20 : e.deltaY;

    if (!scrollLocked) {
      // Re-lock if user scrolls back into the orbit range
      if (targetProgress >= MAX_PROGRESS && dy < 0) {
        scrollLocked = true;
      } else if (targetProgress <= 0 && dy > 0) {
        scrollLocked = true;
      } else {
        return; // still unlocked — let page scroll
      }
      // fall through — first event after re-lock: consume it and resume orbit
    }

    // Release when orbit is complete
    if (targetProgress >= MAX_PROGRESS && dy > 0) {
      scrollLocked = false;
      return;
    }
    if (targetProgress <= 0 && dy < 0) {
      scrollLocked = false;
      return;
    }

    e.preventDefault();
    targetProgress = Math.max(0, Math.min(MAX_PROGRESS,
      targetProgress + dy * SENSITIVITY));
  }, { passive: false });

  /* ─── Entry animation ─────────────────────────────────────────── */
  function boot() {
    // 1. Place cards at initial positions, invisible
    cards.forEach(function (card, i) {
      var p = slotProps(i); // progress=0, so slotOffset=i
      card.style.opacity   = '0';
      card.style.transform = buildTransform(p);
    });

    // 2. After short pause, fade each card in with a stagger
    setTimeout(function () {
      cards.forEach(function (card, i) {
        setTimeout(function () {
          card.style.transition = 'opacity 700ms ease';
          card.style.opacity    = slotProps(i).op.toFixed(3);
        }, i * 110);
      });

      // 3. Once all fades complete, strip transitions and start the loop
      // Last card fade starts at (NUM_CARDS-1)*110 ms, lasts 700ms, +80ms buffer
      var loopDelay = 220 + (NUM_CARDS - 1) * 110 + 700 + 80;
      setTimeout(function () {
        cards.forEach(function (card) { card.style.transition = ''; });
        tick();
      }, loopDelay);
    }, 220);
  }

  /* ─── Boot ────────────────────────────────────────────────────── */
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    // Skip entry animation — place cards directly and start loop
    cards.forEach(function (card, i) {
      var p = slotProps(i);
      card.style.opacity   = p.op.toFixed(3);
      card.style.transform = buildTransform(p);
    });
    tick();
  } else {
    boot();
  }

})();
</script>
</body>
</html>
