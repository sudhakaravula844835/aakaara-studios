<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aakaara Business Card — Print</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --noir:       #09080b;
    --umber:      #1e1a16;
    --ivory:      #faf6f1;
    --champagne:  #f2e6d9;
    --rose:       #c9956b;
    --rose-light: #dbb08a;
    --blush:      #e8c4a8;
  }

  /* 3.5" × 2" at 300 DPI = 1050px × 600px */
  body {
    margin: 0; padding: 0;
    background: #09080b;
    font-family: 'Outfit', 'Helvetica Neue', sans-serif;
    color: var(--ivory);
  }

  .card {
    width: 1050px;
    height: 600px;
    position: relative;
    overflow: hidden;
    page-break-after: always;
  }

  /* ══════ FRONT ══════ */
  .card-front {
    background-color: #0e0c10;
    background-image:
      url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E"),
      radial-gradient(ellipse at 85% 15%, rgba(201,149,107,0.08) 0%, rgba(201,149,107,0.02) 35%, transparent 65%),
      radial-gradient(ellipse at 50% 50%, transparent 30%, rgba(9,8,11,0.4) 100%),
      linear-gradient(155deg, #0e0c10 0%, #151210 25%, #1c1712 50%, #12100e 75%, #0a090c 100%);
  }

  .card-front::before {
    content: '';
    position: absolute;
    top: 0; left: 15%; right: 15%;
    height: 1.5px;
    background: linear-gradient(90deg, transparent, var(--rose) 20%, var(--rose-light) 50%, var(--rose) 80%, transparent);
    opacity: 0.6;
  }

  .card-front::after {
    content: '';
    position: absolute;
    bottom: 0; right: 0;
    width: 260px; height: 260px;
    background: radial-gradient(ellipse at bottom right, rgba(201,149,107,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  .front-watermark {
    position: absolute;
    top: 50%; right: -30px;
    transform: translateY(-50%) rotate(25deg);
    width: 460px; height: 460px;
    opacity: 0.02;
    z-index: 0;
  }

  .front-content {
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
    padding: 3rem 4rem 2.8rem;
    gap: 0.25rem;
  }

  .logo-mark {
    display: flex;
    align-items: center;
    gap: 1.6rem;
    margin-bottom: 0.6rem;
  }

  .logo-icon { width: 92px; height: 92px; }
  .logo-icon svg { width: 100%; height: 100%; }

  .logo-text {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 400;
    font-size: 4.6rem;
    letter-spacing: 0.18em;
    color: var(--ivory);
    line-height: 1;
  }
  .logo-text-wrap { position: relative; display: inline-block; }
  .logo-dots {
    position: absolute;
    top: 0.06em;
    left: 0.85em;
    display: flex;
    gap: 0.18em;
  }
  .logo-dots span {
    width: 0.12em;
    height: 0.12em;
    border-radius: 50%;
    background: var(--rose);
    opacity: 0.85;
  }

  .studios-nyc {
    font-family: 'Outfit', sans-serif;
    font-weight: 300;
    font-size: 0.78rem;
    letter-spacing: 0.68em;
    text-transform: uppercase;
    color: var(--champagne);
    opacity: 0.6;
    margin-top: 0.2rem;
    margin-bottom: 0.3rem;
    padding-left: calc(92px + 1.6rem);
    align-self: flex-start;
  }

  .tagline {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 300;
    font-style: italic;
    font-size: 1.7rem;
    letter-spacing: 0.06em;
    color: var(--rose);
    opacity: 0.8;
    padding-left: calc(92px + 1.6rem);
    align-self: flex-start;
    white-space: nowrap;
  }

  .person-block {
    position: absolute;
    bottom: 2.2rem;
    left: 4rem;
    z-index: 1;
  }
  .person-name {
    font-family: 'Outfit', sans-serif;
    font-weight: 300;
    font-size: 0.95rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--champagne);
    opacity: 0.8;
  }
  .person-role {
    font-family: 'Outfit', sans-serif;
    font-weight: 300;
    font-size: 0.65rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--champagne);
    opacity: 0.5;
    margin-top: 0.2rem;
  }

  /* ══════ BACK ══════ */
  .card-back {
    background-color: #0e0c10;
    background-image:
      url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E"),
      linear-gradient(160deg, #0e0c10 0%, #12100e 40%, #1a1612 70%, #0e0c10 100%);
  }

  .card-back::before {
    content: '';
    position: absolute;
    bottom: 0; left: 10%; right: 10%;
    height: 1.5px;
    background: linear-gradient(90deg, transparent, var(--rose) 20%, var(--rose-light) 50%, var(--rose) 80%, transparent);
    opacity: 0.5;
  }

  .card-back::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 230px; height: 230px;
    background: radial-gradient(ellipse at top left, rgba(201,149,107,0.05) 0%, transparent 70%);
  }

  .back-logo {
    position: absolute;
    top: 2rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    opacity: 0.45;
  }

  .back-person {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    white-space: nowrap;
  }
  .back-person-name {
    font-family: 'Outfit', sans-serif;
    font-weight: 300;
    font-size: 0.75rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--champagne);
    opacity: 0.45;
  }
  .back-person-role {
    font-family: 'Outfit', sans-serif;
    font-weight: 300;
    font-size: 0.58rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--champagne);
    opacity: 0.28;
    margin-top: 0.18rem;
  }
  .back-logo-text {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 400;
    font-size: 1.2rem;
    letter-spacing: 0.12em;
    color: var(--rose);
  }
  .back-logo-wrap { position: relative; display: inline-block; }
  .back-logo-dots {
    position: absolute;
    top: 0.06em;
    left: 0.85em;
    display: flex;
    gap: 0.1em;
  }
  .back-logo-dots span {
    width: 0.12em;
    height: 0.12em;
    border-radius: 50%;
    background: var(--rose);
    opacity: 0.85;
  }

  .back-content {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
    padding: 3.2rem 4rem;
    gap: 4rem;
  }

  .qr-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }
  .qr-frame {
    width: 195px;
    height: 195px;
    background: var(--ivory);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    box-shadow: 0 3px 18px rgba(0,0,0,0.3);
  }
  .qr-code { width: 100%; height: 100%; border-radius: 6px; overflow: hidden; }
  .qr-code canvas, .qr-code img { width: 100% !important; height: 100% !important; }
  .qr-hint {
    font-size: 0.82rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--rose);
    opacity: 0.5;
  }

  .contact-info {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .contact-row {
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .contact-icon {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    opacity: 0.5;
    color: var(--rose);
  }
  .contact-text {
    font-family: 'Outfit', sans-serif;
    font-weight: 300;
    font-size: 1.1rem;
    letter-spacing: 0.06em;
    color: var(--champagne);
    opacity: 0.8;
  }

  @media print {
    body { background: none; }
    .card { page-break-after: always; }
  }
</style>
</head>
<body>

<!-- ═══ FRONT SIDE ═══ -->
<div class="card card-front">
  <div class="front-watermark">
    <svg viewBox="0 0 60 60" fill="none"><g transform="translate(30,30)">
      <path d="M0,-18 C5.1,-18 9.4,-12 7.7,-3.4 C6,5.1 -2.6,7.7 -7.7,3.4 C-12.9,-0.9 -9.4,-12.9 -3.4,-17.1 C-2.1,-17.8 -1.1,-18 0,-18Z" fill="none" stroke="#c9956b" stroke-width="0.4" opacity="1"/>
      <path d="M0,-18 C5.1,-18 9.4,-12 7.7,-3.4 C6,5.1 -2.6,7.7 -7.7,3.4 C-12.9,-0.9 -9.4,-12.9 -3.4,-17.1 C-2.1,-17.8 -1.1,-18 0,-18Z" fill="none" stroke="#c9956b" stroke-width="0.4" opacity="0.6" transform="rotate(72)"/>
      <path d="M0,-18 C5.1,-18 9.4,-12 7.7,-3.4 C6,5.1 -2.6,7.7 -7.7,3.4 C-12.9,-0.9 -9.4,-12.9 -3.4,-17.1 C-2.1,-17.8 -1.1,-18 0,-18Z" fill="none" stroke="#c9956b" stroke-width="0.4" opacity="0.35" transform="rotate(144)"/>
      <path d="M0,-18 C5.1,-18 9.4,-12 7.7,-3.4 C6,5.1 -2.6,7.7 -7.7,3.4 C-12.9,-0.9 -9.4,-12.9 -3.4,-17.1 C-2.1,-17.8 -1.1,-18 0,-18Z" fill="none" stroke="#c9956b" stroke-width="0.4" opacity="0.2" transform="rotate(216)"/>
    </g></svg>
  </div>
  <div class="front-content">
    <div class="logo-mark">
      <div class="logo-icon">
        <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(30,30)">
            <circle cx="0" cy="0" r="25.7" fill="none" stroke="#c9956b" stroke-width="0.6" opacity="0.25"/>
            <path d="M0,-18 C5.1,-18 9.4,-12 7.7,-3.4 C6,5.1 -2.6,7.7 -7.7,3.4 C-12.9,-0.9 -9.4,-12.9 -3.4,-17.1 C-2.1,-17.8 -1.1,-18 0,-18Z" fill="none" stroke="#c9956b" stroke-width="1.2" opacity="0.85"/>
            <path d="M0,-18 C5.1,-18 9.4,-12 7.7,-3.4 C6,5.1 -2.6,7.7 -7.7,3.4 C-12.9,-0.9 -9.4,-12.9 -3.4,-17.1 C-2.1,-17.8 -1.1,-18 0,-18Z" fill="none" stroke="#c9956b" stroke-width="1.2" opacity="0.55" transform="rotate(72)"/>
            <path d="M0,-18 C5.1,-18 9.4,-12 7.7,-3.4 C6,5.1 -2.6,7.7 -7.7,3.4 C-12.9,-0.9 -9.4,-12.9 -3.4,-17.1 C-2.1,-17.8 -1.1,-18 0,-18Z" fill="none" stroke="#c9956b" stroke-width="1.2" opacity="0.35" transform="rotate(144)"/>
            <path d="M0,-18 C5.1,-18 9.4,-12 7.7,-3.4 C6,5.1 -2.6,7.7 -7.7,3.4 C-12.9,-0.9 -9.4,-12.9 -3.4,-17.1 C-2.1,-17.8 -1.1,-18 0,-18Z" fill="none" stroke="#c9956b" stroke-width="1.2" opacity="0.2" transform="rotate(216)"/>
            <circle cx="0" cy="0" r="2.5" fill="#c9956b" opacity="0.85"/>
          </g>
        </svg>
      </div>
      <span class="logo-text logo-text-wrap">
        <span class="logo-dots"><span></span><span></span></span>
        Aakaara
      </span>
    </div>
    <div class="studios-nyc">Studios &middot; New York City</div>
    <div class="tagline">Every story deserves its own canvas.</div>
  </div>
  <div class="person-block">
    <div class="person-name">Sudhakar Avula</div>
    <div class="person-role">Founder &amp; Lead Photographer</div>
  </div>
</div>

<!-- ═══ BACK SIDE ═══ -->
<div class="card card-back">
  <div class="back-logo">
    <span class="back-logo-text back-logo-wrap">
      <span class="back-logo-dots"><span></span><span></span></span>
      Aakaara
    </span>
  </div>
  <div class="back-content">
    <div class="qr-section">
      <div class="qr-frame">
        <div class="qr-code">
          <canvas id="qrCanvas" width="200" height="200"></canvas>
        </div>
      </div>
      <span class="qr-hint">Scan to explore</span>
    </div>
    <div class="contact-info">
      <div class="contact-row">
        <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
          <path d="M2 12h20M12 2c2.5 2.5 4 6 4 10s-1.5 7.5-4 10c-2.5-2.5-4-6-4-10s1.5-7.5 4-10z"/>
        </svg>
        <span class="contact-text">www.aakaarastudiosnyc.com</span>
      </div>
      <div class="contact-row">
        <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="M22 4L12 13 2 4"/>
        </svg>
        <span class="contact-text">info@aakaarastudiosnyc.com</span>
      </div>
      <div class="contact-row">
        <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.12 4.18 2 2 0 014.11 2h3a2 2 0 012 1.72c.13.81.36 1.6.68 2.35a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.75.32 1.54.55 2.35.68a2 2 0 011.72 2.03z"/>
        </svg>
        <span class="contact-text">+1 (475) 332-2020</span>
      </div>
      <div class="contact-row">
        <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="2" width="20" height="20" rx="5"/>
          <circle cx="12" cy="12" r="5"/>
          <circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
        <span class="contact-text">@aakaarastudiosnyc</span>
      </div>
      <div class="contact-row">
        <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1118 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        <span class="contact-text">New York City, NY</span>
      </div>
    </div>
  </div>
  <div class="back-person">
    <div class="back-person-name">Sudhakar Avula</div>
    <div class="back-person-role">Founder &amp; Lead Photographer</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
(function() {
  var container = document.getElementById('qrCanvas');
  if (!container) return;
  var parent = container.parentElement;
  parent.removeChild(container);
  new QRCode(parent, {
    text: 'https://www.aakaarastudiosnyc.com',
    width: 200,
    height: 200,
    colorDark: '#09080b',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });
})();
</script>
</body>
</html>
