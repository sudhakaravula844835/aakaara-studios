<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aakaara — Instagram DP Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #faf6f1;
    font-family: 'Outfit', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 1.6rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(250,246,241,0.5);
    margin-bottom: 0.5rem;
  }
  .page-subtitle {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    color: rgba(201,149,107,0.5);
    margin-bottom: 2.5rem;
  }

  /* ═══ DP CANVAS ═══ */
  .dp-container {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    border-radius: 50%;
    box-shadow: 0 0 80px rgba(201,149,107,0.06);
  }

  #dpCanvas {
    width: 1080px;
    height: 1080px;
    position: relative;
    background: #080706;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    overflow: hidden;
  }

  /* Film grain texture via CSS noise */
  #dpCanvas::before {
    content: '';
    position: absolute;
    inset: -50%;
    width: 200%;
    height: 200%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    background-size: 256px 256px;
    opacity: 1;
    pointer-events: none;
    z-index: 3;
    mix-blend-mode: overlay;
  }

  /* Warm cinematic light leak — top left */
  #dpCanvas::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 25% 20%, rgba(201,149,107,0.07) 0%, transparent 50%),
      radial-gradient(ellipse at 75% 80%, rgba(140,100,65,0.04) 0%, transparent 45%),
      radial-gradient(ellipse at 50% 50%, rgba(201,149,107,0.02) 0%, transparent 70%);
    pointer-events: none;
    z-index: 1;
  }

  /* Vignette */
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 2;
  }

  /* ═══ TEXT CONTENT ═══ */
  .dp-content {
    position: relative;
    z-index: 4;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .dp-name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 120px;
    letter-spacing: 0.05em;
    color: #faf6f1;
    line-height: 1;
    position: relative;
  }

  .dp-dots {
    position: absolute;
    top: -20px;
    left: 98px;
    display: flex;
    gap: 12px;
  }
  .dp-dots span {
    width: 11px;
    height: 11px;
    background: #c9956b;
    border-radius: 50%;
    opacity: 0.9;
  }

  .dp-divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,149,107,0.5), transparent);
    margin: 28px 0 24px;
  }

  .dp-subtitle {
    font-family: 'Outfit', sans-serif;
    font-weight: 300;
    font-size: 22px;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: rgba(201,149,107,0.65);
  }

  .dp-location {
    font-family: 'Outfit', sans-serif;
    font-weight: 200;
    font-size: 16px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(250,246,241,0.25);
    margin-top: 14px;
  }

  /* Variant: Monogram */
  .dp-monogram {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 280px;
    color: #faf6f1;
    line-height: 1;
    position: relative;
  }
  .dp-monogram .dp-dots {
    top: -36px;
    left: 82px;
    gap: 16px;
  }
  .dp-monogram .dp-dots span {
    width: 14px;
    height: 14px;
  }

  /* Variant: Editorial */
  .dp-editorial-name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: 100px;
    letter-spacing: 0.04em;
    color: #faf6f1;
    line-height: 1.1;
    position: relative;
  }
  .dp-editorial-name .dp-dots {
    top: -18px;
    left: 82px;
  }

  .dp-editorial-tagline {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: 28px;
    color: rgba(250,246,241,0.4);
    margin-top: 20px;
    letter-spacing: 0.06em;
  }

  /* ═══ PREVIEW ═══ */
  .preview-wrap {
    position: relative;
    margin-bottom: 2rem;
  }
  .preview-wrap .circle-guide {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px dashed rgba(201,149,107,0.15);
    pointer-events: none;
    z-index: 10;
  }
  .preview-scaled {
    transform: scale(0.45);
    transform-origin: top center;
  }

  /* ═══ CONTROLS ═══ */
  .controls {
    display: flex;
    gap: 1rem;
    margin-top: -280px;
    position: relative;
    z-index: 20;
  }
  .btn {
    background: transparent;
    border: 1px solid rgba(201,149,107,0.3);
    color: #c9956b;
    font-family: 'Outfit', sans-serif;
    font-size: 0.75rem;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.9rem 2rem;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .btn:hover {
    background: rgba(201,149,107,0.1);
    border-color: #c9956b;
  }
  .btn-primary {
    background: #c9956b;
    color: #0a0a0a;
    border-color: #c9956b;
  }
  .btn-primary:hover { background: #d4a67a; }

  .variants {
    display: flex;
    gap: 1.5rem;
    margin-top: 2rem;
    margin-bottom: 1rem;
  }
  .variant-btn {
    background: none;
    border: 1px solid rgba(201,149,107,0.15);
    color: rgba(250,246,241,0.4);
    font-family: 'Outfit', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 0.6rem 1.2rem;
    cursor: pointer;
    transition: all 0.3s;
    border-radius: 2px;
  }
  .variant-btn.active,
  .variant-btn:hover {
    border-color: #c9956b;
    color: #c9956b;
  }
</style>
</head>
<body>

<h1>Instagram DP Generator</h1>
<p class="page-subtitle">1080 &times; 1080 px &middot; cinematic film grain &middot; optimized for circular crop</p>

<div class="variants">
  <button class="variant-btn active" onclick="setVariant('brand')">Brand</button>
  <button class="variant-btn" onclick="setVariant('monogram')">Monogram</button>
  <button class="variant-btn" onclick="setVariant('editorial')">Editorial</button>
</div>

<div class="preview-wrap">
  <div class="preview-scaled">
    <div class="dp-container">
      <div id="dpCanvas">
        <div class="vignette"></div>

        <div class="dp-content" id="dpContent">
          <!-- Default: Brand variant -->
          <div class="dp-name">
            <div class="dp-dots"><span></span><span></span></div>
            Aakaara
          </div>
          <div class="dp-divider"></div>
          <div class="dp-subtitle">Studios</div>
          <div class="dp-location">New York City</div>
        </div>
      </div>
    </div>
    <div class="circle-guide"></div>
  </div>
</div>

<div class="controls">
  <button class="btn btn-primary" onclick="downloadDP()">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2v9m0 0L4 7.5m4 3.5l4-3.5M2 13h12"/></svg>
    Download PNG
  </button>
</div>

<script>
function setVariant(type) {
  document.querySelectorAll('.variant-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');

  const content = document.getElementById('dpContent');

  if (type === 'brand') {
    content.innerHTML = `
      <div class="dp-name">
        <div class="dp-dots"><span></span><span></span></div>
        Aakaara
      </div>
      <div class="dp-divider"></div>
      <div class="dp-subtitle">Studios</div>
      <div class="dp-location">New York City</div>
    `;
  } else if (type === 'monogram') {
    content.innerHTML = `
      <div class="dp-monogram">
        <div class="dp-dots"><span></span><span></span></div>
        A
      </div>
      <div class="dp-divider" style="margin-top:16px;"></div>
      <div class="dp-subtitle" style="font-size:18px; letter-spacing:0.5em;">Aakaara Studios</div>
    `;
  } else if (type === 'editorial') {
    content.innerHTML = `
      <div class="dp-editorial-name">
        <div class="dp-dots"><span></span><span></span></div>
        Aakaara
      </div>
      <div class="dp-editorial-tagline">Every story deserves its own canvas.</div>
      <div class="dp-divider" style="margin-top:30px;"></div>
      <div class="dp-location" style="margin-top:0;">NYC</div>
    `;
  }
}

async function downloadDP() {
  const canvas = document.getElementById('dpCanvas');
  try {
    if (typeof html2canvas !== 'undefined') {
      const c = await html2canvas(canvas, {
        width: 1080, height: 1080, scale: 1,
        backgroundColor: null, useCORS: true
      });
      const link = document.createElement('a');
      link.download = 'aakaara-insta-dp.png';
      link.href = c.toDataURL('image/png');
      link.click();
    } else {
      const script = document.createElement('script');
      script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
      script.onload = () => downloadDP();
      document.head.appendChild(script);
    }
  } catch(e) {
    alert('Export failed. Try taking a screenshot of the preview instead.');
  }
}
</script>
</body>
</html>
