<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aakaara — Instagram DP Generator</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #faf6f1;
    font-family: 'Outfit', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 1.6rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(250,246,241,0.5);
    margin-bottom: 0.5rem;
  }
  .page-subtitle {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    color: rgba(201,149,107,0.5);
    margin-bottom: 2.5rem;
  }

  /* ═══ DP CANVAS ═══ */
  .dp-container {
    position: relative;
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    border-radius: 4px;
    box-shadow: 0 50px 100px rgba(0,0,0,0.9), 0 0 80px rgba(201,149,107,0.08);
  }

  #dpCanvas {
    width: 1080px;
    height: 1350px;
    position: relative;
    background: #080706;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    overflow: hidden;
  }

  /* Film grain texture via CSS noise (moved to real div for reliable capture) */
  .grain-overlay {
    position: absolute;
    inset: -50%;
    width: 200%;
    height: 200%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    background-size: 256px 256px;
    opacity: 1;
    pointer-events: none;
    z-index: 3;
    mix-blend-mode: overlay;
  }

  /* Warm cinematic light leak (moved to real div for reliable capture) */
  .light-leak {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 25% 20%, rgba(201,149,107,0.07) 0%, transparent 50%),
      radial-gradient(ellipse at 75% 80%, rgba(140,100,65,0.04) 0%, transparent 45%),
      radial-gradient(ellipse at 50% 50%, rgba(201,149,107,0.02) 0%, transparent 70%);
    pointer-events: none;
    z-index: 1;
  }

  .content-glow {
    position: absolute;
    left: 50%;
    top: 49%;
    width: 860px;
    height: 720px;
    transform: translate(-50%, -50%);
    background:
      radial-gradient(circle at 50% 46%, rgba(201,149,107,0.14) 0%, rgba(201,149,107,0.1) 18%, rgba(201,149,107,0.05) 38%, rgba(201,149,107,0.02) 56%, transparent 74%);
    border-radius: 50%;
    filter: blur(30px);
    opacity: 0.95;
    pointer-events: none;
    z-index: 2;
  }

  /* Vignette */
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 2;
  }

  /* ═══ TEXT CONTENT ═══ */
  .dp-content {
    position: relative;
    z-index: 4;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .dp-name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 120px;
    letter-spacing: 0.08em;
    color: #faf6f1;
    line-height: 1;
    position: relative;
    text-shadow: 0 12px 30px rgba(0,0,0,0.7), 0 0 20px rgba(201,149,107,0.15);
  }

  .dp-dots {
    position: absolute;
    top: 10px;
    left: 98px;
    display: flex;
    gap: 12px;
  }
  .dp-dots span {
    width: 13px;
    height: 13px;
    background: #c9956b;
    border-radius: 50%;
    opacity: 0.9;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }

  .dp-divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,149,107,0.5), transparent);
    margin: 28px 0 24px;
  }

  .dp-subtitle {
    font-family: 'Outfit', sans-serif;
    font-weight: 400;
    font-size: 22px;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: rgba(201,149,107,0.65);
  }

  .dp-location {
    font-family: 'Outfit', sans-serif;
    font-weight: 200;
    font-size: 16px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(250,246,241,0.25);
    margin-top: 14px;
    text-shadow: 0 5px 15px rgba(0,0,0,0.5);
  }

  /* Variant: Monogram */
  .dp-monogram {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 280px;
    color: #faf6f1;
    line-height: 1;
    position: relative;
    text-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(201,149,107,0.1);
  }
  .dp-monogram .dp-dots {
    top: 5px;
    left: 65px;
    gap: 15px;
  }
  .dp-monogram .dp-dots span {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    opacity: 0.9;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }

  /* Variant: Editorial */
  .dp-editorial-name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: 100px;
    letter-spacing: 0.1em;
    color: #faf6f1;
    line-height: 1.1;
    position: relative;
    text-shadow: 0 10px 25px rgba(0,0,0,0.6);
  }
  .dp-editorial-name .dp-dots {
    top: 10px;
    left: 80px; 
    gap: 10px;
  }
  .dp-editorial-name .dp-dots span {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    opacity: 0.9;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }

  .dp-editorial-tagline {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-style: italic;
    font-size: 28px;
    color: rgba(250,246,241,0.6);
    margin-top: 16px;
    letter-spacing: 0.20em;
    text-align: center;
    text-shadow: 0 5px 15px rgba(0,0,0,0.5);
  
  }

  /* ═══ PREVIEW ═══ */
  .preview-wrap {
    position: relative;
    margin-bottom: 2rem;
  }
  .preview-wrap .circle-guide {
    position: absolute;
    inset: 0;
    border-radius: 4px;
    border: 2px dashed rgba(201,149,107,0.15);
    pointer-events: none;
    z-index: 10;
  }
  .preview-scaled {
    transform: scale(0.45);
    transform-origin: top center;
  }

  /* ═══ CONTROLS ═══ */
  .controls {
    display: flex;
    gap: 1rem;
    margin-top: -420px;
    position: relative;
    z-index: 20;
  }
  .btn {
    background: transparent;
    border: 1px solid rgba(201,149,107,0.3);
    color: #c9956b;
    font-family: 'Outfit', sans-serif;
    font-size: 0.75rem;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.9rem 2rem;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .btn:hover {
    background: rgba(201,149,107,0.1);
    border-color: #c9956b;
  }
  .btn-primary {
    background: #c9956b;
    color: #0a0a0a;
    border-color: #c9956b;
  }
  .btn-primary:hover { background: #d4a67a; }

  .variants {
    display: flex;
    gap: 1.5rem;
    margin-top: 2rem;
    margin-bottom: 1rem;
  }
  .variant-btn {
    background: none;
    border: 1px solid rgba(201,149,107,0.15);
    color: rgba(250,246,241,0.4);
    font-family: 'Outfit', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 0.6rem 1.2rem;
    cursor: pointer;
    transition: all 0.3s;
    border-radius: 2px;
  }
  .variant-btn.active,
  .variant-btn:hover {
    border-color: #c9956b;
    color: #c9956b;
  }
</style>
</head>
<body>

<h1>Instagram DP Generator</h1>
<p class="page-subtitle">2160 &times; 2700 px &middot; cinematic film grain &middot; 4:5 retina quality</p>

<div class="top-actions" style="margin-bottom: 2rem;">
  <button class="btn btn-primary" onclick="downloadDP(this)">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2v9m0 0L4 7.5m4 3.5l4-3.5M2 13h12"/></svg>
    Quick Download
  </button>
</div>

<div class="variants">
  <button class="variant-btn active" onclick="setVariant('brand', this)">Brand</button>
  <button class="variant-btn" onclick="setVariant('monogram', this)">Monogram</button>
  <button class="variant-btn" onclick="setVariant('editorial', this)">Editorial</button>
</div>

<div class="preview-wrap">
  <div class="preview-scaled">
    <div class="dp-container">
      <div id="dpCanvas">
        <div class="vignette"></div>
        <div class="grain-overlay"></div>
        <div class="light-leak"></div>
        <div class="content-glow"></div>

        <div class="dp-content" id="dpContent">
          <!-- Default: Brand variant -->
          <div class="dp-name">
            <div class="dp-dots"><span></span><span></span></div>
            Aakaara
          </div>
          <div class="dp-divider"></div>
          <div class="dp-subtitle">Studios</div>
          <div class="dp-location">New York City</div>
        </div>
      </div>
    </div>
    <div class="circle-guide"></div>
  </div>
</div>

<div class="controls">
  <button class="btn btn-primary" onclick="downloadDP(this)">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2v9m0 0L4 7.5m4 3.5l4-3.5M2 13h12"/></svg>
    Download PNG
  </button>
</div>

<script>
let currentVariant = 'brand';

function getVariantMarkup(type) {
  if (type === 'monogram') {
    return `
      <div class="dp-monogram">
        <div class="dp-dots"><span></span><span></span></div>
        A
      </div>
      <div class="dp-divider" style="margin-top:16px;"></div>
      <div class="dp-subtitle" style="font-size:18px; letter-spacing:0.5em;">Aakaara Studios</div>
    `;
  }

  if (type === 'editorial') {
    return `
      <div class="dp-editorial-name">
        <div class="dp-dots"><span></span><span></span></div>
        Aakaara
      </div>
      <div class="dp-editorial-tagline">Every story deserves its own canvas.</div>
      <div class="dp-divider" style="margin-top:30px;"></div>
      <div class="dp-location" style="margin-top:0;">NYC</div>
    `;
  }

  return `
    <div class="dp-name">
      <div class="dp-dots"><span></span><span></span></div>
      Aakaara
    </div>
    <div class="dp-divider"></div>
    <div class="dp-subtitle">Studios</div>
    <div class="dp-location">New York City</div>
  `;
}

function setVariant(type, btn) {
  currentVariant = type;
  document.querySelectorAll('.variant-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');

  const content = document.getElementById('dpContent');
  content.innerHTML = getVariantMarkup(type);
}

async function downloadDP(btn) {
  var el = document.getElementById('dpCanvas');
  var exportEl = el.cloneNode(true);
  var exportContent = exportEl.querySelector('#dpContent');
  
  if (exportContent) {
    exportContent.innerHTML = getVariantMarkup(currentVariant);
  }

  // Avoid duplicate ids in the temporary export node.
  exportEl.querySelectorAll('[id]').forEach(function(node) {
    node.removeAttribute('id');
  });

  el.classList.add('is-visible');
  exportEl.classList.add('is-visible');
  exportEl.id = 'dpCanvasExport';
  exportEl.style.position = 'absolute';
  exportEl.style.left = '-99999px';
  exportEl.style.top = '0';
  exportEl.style.width = '1080px';
  exportEl.style.height = '1350px';
  exportEl.style.transform = 'none';
  exportEl.style.margin = '0';
  exportEl.style.display = 'flex';
  exportEl.style.alignItems = 'center';
  exportEl.style.justifyContent = 'center';
  exportEl.style.overflow = 'hidden';
  exportEl.style.zIndex = '-1';
  document.body.appendChild(exportEl);

  // Last child of the button is the text node after the SVG
  var textNode = btn.lastChild;
  var savedText = textNode.textContent;
  textNode.textContent = ' Exporting\u2026';
  btn.disabled = true;

  try {
    if (document.fonts && document.fonts.ready) {
      await document.fonts.ready;
    }
  } catch (e) {}

  html2canvas(exportEl, {
    scale: 3,
    useCORS: true,
    allowTaint: false,
    backgroundColor: null,
    width: 1080,
    height: 1350,
    windowWidth: 1080,
    windowHeight: 1350,
    scrollX: 0,
    scrollY: 0,
    logging: false,
    onclone: function(clonedDoc) {
      clonedDoc.querySelectorAll('.dp-divider').forEach(function(divider) {
        // html2canvas can fail on this gradient background in the cloned tree,
        // so flatten it to a simple line for export only.
        divider.style.backgroundImage = 'none';
        divider.style.background = 'rgba(201,149,107,0.5)';
      });

      var leak = clonedDoc.querySelector('.light-leak');
      if (leak) {
        leak.style.background = [
          'radial-gradient(ellipse at 25% 20%, rgba(201,149,107,0.12) 0%, transparent 52%)',
          'radial-gradient(ellipse at 75% 80%, rgba(140,100,65,0.08) 0%, transparent 48%)',
          'radial-gradient(ellipse at 50% 50%, rgba(201,149,107,0.06) 0%, transparent 72%)'
        ].join(',');
      }

      var contentGlow = clonedDoc.querySelector('.content-glow');
      if (contentGlow) {
        contentGlow.style.width = '980px';
        contentGlow.style.height = '820px';
        contentGlow.style.borderRadius = '50%';
        contentGlow.style.filter = 'blur(14px)';
        contentGlow.style.opacity = '1';
        contentGlow.style.background = 'radial-gradient(circle at 50% 46%, rgba(201,149,107,0.2) 0%, rgba(201,149,107,0.13) 20%, rgba(201,149,107,0.06) 42%, rgba(201,149,107,0.025) 58%, transparent 76%)';
      }
    }
  }).then(function(canvas) {
    var link = document.createElement('a');
    link.download = 'aakaara-insta-dp-' + currentVariant + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    exportEl.remove();
    textNode.textContent = savedText;
    btn.disabled = false;
  }).catch(function(e) {
    console.error(e);
    alert('Export failed. Try taking a screenshot of the preview instead.');
    exportEl.remove();
    textNode.textContent = savedText;
    btn.disabled = false;
  });
}
</script>
</body>
</html>
