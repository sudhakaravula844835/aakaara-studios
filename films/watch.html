<style>
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --noir:         #09080b;
  --rose:         #c9956b;
  --ivory:        #faf6f1;
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-body:    'Outfit', 'Helvetica Neue', sans-serif;
  --ease:         cubic-bezier(0.16, 1, 0.3, 1);
}

html, body {
  height: 100%;
  background: var(--noir);
  color: var(--ivory);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ─── grain ─────────────────────────────────────────────────── */
body::after {
  content: '';
  position: fixed; inset: 0;
  pointer-events: none; z-index: 500;
  opacity: 0.03;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 180px 180px;
}

/* ─── ambient bloom ──────────────────────────────────────────
   The film's poster, blurred to nothing, becomes the room it
   plays in. Mounika's forest greens breathe differently from
   a warm Diwali hall or a pastel gender reveal. Pure black is
   a neutral; this is the film's own atmosphere.               */
.film-ambient {
  position: fixed; inset: -25%;
  z-index: 0;
  background-size: cover;
  background-position: center;
  filter: blur(140px) saturate(0.6) brightness(0.15);
  opacity: 0;
  transition: opacity 3.2s ease;
  pointer-events: none;
  will-change: opacity;
}
.film-ambient.visible { opacity: 1; }

/* ─── nav ────────────────────────────────────────────────── */
.film-nav {
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 200;
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.25rem 2rem;
  background: linear-gradient(to bottom, rgba(9,8,11,0.88) 0%, transparent 100%);
}

.film-logo {
  display: flex; align-items: center; gap: 0.65rem;
  text-decoration: none; color: var(--ivory);
}
.film-logo svg { width: 34px; height: 34px; flex-shrink: 0; }
.film-logo-text {
  font-family: var(--font-display);
  font-size: 0.92rem; font-weight: 300; letter-spacing: 0.22em;
}

.film-back {
  display: flex; align-items: center; gap: 0.5rem;
  font-size: 0.46rem; letter-spacing: 0.32em; text-transform: uppercase;
  color: rgba(250,246,241,0.32); text-decoration: none;
  transition: color 0.3s;
}
.film-back:hover { color: var(--rose); }

/* ─── main ───────────────────────────────────────────────── */
.film-wrap {
  position: relative; z-index: 1;
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 5.5rem 2rem 3.5rem;
}

/* ─── player ─────────────────────────────────────────────── */
.player-shell { width: 100%; max-width: 980px; }

.player-stage {
  position: relative; width: 100%; aspect-ratio: 16/9;
  background: #0c0a0e; border-radius: 6px; overflow: hidden;
  cursor: pointer;
  box-shadow: 0 32px 72px rgba(0,0,0,0.6), 0 0 0 1px rgba(250,246,241,0.04);
}
.player-stage video {
  width: 100%; height: 100%; object-fit: contain; display: block;
}

.player-poster {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  background-color: #0c0a0e;
  transition: opacity 0.8s var(--ease);
  z-index: 2;
}
.player-poster.gone { opacity: 0; pointer-events: none; }

.player-big-play {
  position: absolute; inset: 0; z-index: 3;
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.4s;
}
.player-big-play.gone { opacity: 0; pointer-events: none; }

.play-ring {
  width: 74px; height: 74px; border-radius: 50%;
  border: 1px solid rgba(201,149,107,0.5);
  display: flex; align-items: center; justify-content: center;
  background: rgba(9,8,11,0.4);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  transition: transform 0.4s var(--ease), border-color 0.3s, background 0.3s;
}
.play-ring:hover {
  transform: scale(1.1);
  border-color: var(--rose);
  background: rgba(201,149,107,0.12);
}
.play-ring svg { margin-left: 4px; }

.player-controls {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 4;
  padding: 3rem 1.1rem 0.85rem;
  background: linear-gradient(to top, rgba(9,8,11,0.95) 0%, rgba(9,8,11,0.3) 60%, transparent 100%);
  display: flex; align-items: center; gap: 0.6rem;
  opacity: 0; transition: opacity 0.3s;
}
.player-stage:hover .player-controls,
.player-stage.is-paused .player-controls { opacity: 1; }

.ctrl-btn {
  background: none; border: none; color: rgba(250,246,241,0.65);
  cursor: pointer; padding: 0.3rem;
  display: flex; align-items: center; justify-content: center;
  transition: color 0.2s;
  min-width: 36px; min-height: 36px; flex-shrink: 0;
}
.ctrl-btn:hover { color: var(--rose); }

/* progress: large click target, thin visible rail */
.progress-track {
  flex: 1; height: 20px;
  display: flex; align-items: center;
  cursor: pointer;
}
.progress-rail {
  width: 100%; height: 2px;
  background: rgba(250,246,241,0.12); border-radius: 2px;
  position: relative; transition: height 0.15s;
}
.progress-track:hover .progress-rail { height: 3px; }
.progress-fill {
  position: absolute; top: 0; left: 0;
  height: 100%; width: 0%;
  background: var(--rose); border-radius: 2px;
  pointer-events: none;
}

.time-display {
  font-size: 0.57rem; color: rgba(250,246,241,0.38);
  font-variant-numeric: tabular-nums; letter-spacing: 0.05em;
  min-width: 36px; text-align: right; flex-shrink: 0;
}

/* ─── info row ───────────────────────────────────────────── */
.film-info {
  width: 100%; max-width: 980px;
  margin-top: 1.6rem;
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 2rem;
}

.film-info-text { flex: 1; min-width: 0; }

/* staggered entry */
@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0);    }
}
.a1 { animation: slideUp 0.6s var(--ease) 0.06s both; }
.a2 { animation: slideUp 0.6s var(--ease) 0.15s both; }
.a3 { animation: slideUp 0.6s var(--ease) 0.22s both; }
.a4 { animation: slideUp 0.6s var(--ease) 0.3s  both; }
.a5 { animation: slideUp 0.6s var(--ease) 0.36s both; }
.a6 { animation: slideUp 0.6s var(--ease) 0.2s  both; }
@media (prefers-reduced-motion: reduce) {
  .a1,.a2,.a3,.a4,.a5,.a6 { animation: none; }
}

.film-category {
  font-size: 0.44rem; letter-spacing: 0.36em; text-transform: uppercase;
  color: var(--rose); margin-bottom: 0.2rem;
}
.film-title {
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 3.5vw, 2.1rem);
  font-weight: 300; color: var(--ivory);
  letter-spacing: 0.02em; line-height: 1.15;
}
.film-type {
  font-size: 0.45rem; letter-spacing: 0.22em; text-transform: uppercase;
  color: rgba(250,246,241,0.27); margin-top: 0.2rem;
}
.film-rule {
  width: 30px; height: 1px;
  background: rgba(201,149,107,0.2);
  margin: 0.9rem 0 0.65rem;
}
.film-studio {
  font-size: 0.41rem; letter-spacing: 0.28em; text-transform: uppercase;
  color: rgba(250,246,241,0.15);
}

/* ─── CTA ────────────────────────────────────────────────── */
.film-cta {
  flex-shrink: 0;
  display: flex; flex-direction: column;
  align-items: flex-end; gap: 0.4rem;
  padding-top: 0.12rem; /* align baseline with category label */
}
.film-cta-label {
  font-size: 0.41rem; letter-spacing: 0.3em; text-transform: uppercase;
  color: rgba(250,246,241,0.2);
}
.film-cta-link {
  display: inline-flex; align-items: center; gap: 0.55rem;
  padding: 0.65rem 1.15rem;
  border: 1px solid rgba(201,149,107,0.28);
  color: var(--rose); text-decoration: none;
  font-size: 0.45rem; letter-spacing: 0.26em; text-transform: uppercase;
  white-space: nowrap;
  transition: background 0.3s var(--ease), border-color 0.3s;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
.film-cta-link:hover {
  background: rgba(201,149,107,0.08);
  border-color: rgba(201,149,107,0.55);
}
.film-cta-link svg { transition: transform 0.3s var(--ease); flex-shrink: 0; }
.film-cta-link:hover svg { transform: translateX(3px); }

/* ─── not found ──────────────────────────────────────────── */
.not-found {
  position: relative; z-index: 1;
  text-align: center; padding: 3rem 2rem; max-width: 440px;
}
.not-found h2 {
  font-family: var(--font-display);
  font-size: 2rem; font-weight: 300; color: var(--ivory);
  letter-spacing: 0.02em; margin-bottom: 0.75rem;
}
.not-found p {
  font-size: 0.82rem; color: rgba(250,246,241,0.38);
  line-height: 1.7; margin-bottom: 2rem;
}
.not-found a {
  font-size: 0.46rem; letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--rose); text-decoration: none;
  display: inline-flex; align-items: center; gap: 0.4rem;
}

/* ─── mobile ─────────────────────────────────────────────── */
@media (max-width: 768px) {
  .film-nav { padding: 1rem 1.25rem; }
  .film-logo-text { display: none; }
  .film-wrap { padding: 4rem 0 2.5rem; }
  .player-stage { border-radius: 0; box-shadow: none; }
  .film-info { flex-direction: column; gap: 1.25rem; padding: 0 1.25rem; }
  .film-cta { align-items: flex-start; }
  .play-ring { width: 62px; height: 62px; }
}
</style>
</head>

<script>

// ─── resolve slug ───────────────────────────────────────────────────────────
const pathSlug = location.pathname.replace(/^\/films\/?/, '').replace(/\.html$/, '');
const paramSlug = new URLSearchParams(location.search).get('v') || '';
const slug = (pathSlug && pathSlug !== 'watch') ? pathSlug : paramSlug;

const wrap    = document.getElementById('filmWrap');
const ambient = document.getElementById('filmAmbient');
const film    = VIDEOS[slug];

if (!film) {
  wrap.innerHTML = `
    <div class="not-found">
      <h2>Film not found.</h2>
      <p>This link may be incorrect, or the film hasn't been published yet.</p>
      <a href="/#video-works">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        View all films
      </a>
    </div>`;
} else {
  // update page title
  document.title = `${film.title} — ${film.category} · Aakaara Studios NYC`;

  // ambient bloom: the poster image becomes the room's atmosphere
  if (film.poster) {
    ambient.style.backgroundImage = `url('${film.poster}')`;
    requestAnimationFrame(() => setTimeout(() => ambient.classList.add('visible'), 80));
  }

  wrap.innerHTML = `
    <div class="player-shell">
      <div class="player-stage is-paused" id="stage">
        <video id="vid" playsinline preload="metadata" webkit-playsinline="true"></video>
        <div class="player-poster${film.poster ? '' : ' gone'}" id="poster"${film.poster ? ` style="background-image:url('${film.poster}')"` : ''}></div>
        <div class="player-big-play" id="bigPlay">
          <div class="play-ring">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </div>
        </div>
        <div class="player-controls" id="controls">
          <button class="ctrl-btn" id="playBtn" aria-label="Play / pause">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </button>
          <div class="progress-track" id="progressTrack" role="slider" aria-label="Video progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-rail"><div class="progress-fill" id="progressFill"></div></div>
          </div>
          <div class="time-display" id="timeDisplay">0:00</div>
          <button class="ctrl-btn" id="muteBtn" aria-label="Toggle mute">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          </button>
          <button class="ctrl-btn" id="fsBtn" aria-label="Fullscreen">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="film-info">
      <div class="film-info-text">
        <div class="film-category a1">${film.category}</div>
        <h1 class="film-title a2">${film.title}</h1>
        <div class="film-type a3">${film.type}</div>
        <div class="film-rule a4"></div>
        <div class="film-studio a5">Aakaara Studios NYC &nbsp;·&nbsp; aakaarastudiosnyc.com</div>
      </div>
      <div class="film-cta a6">
        <div class="film-cta-label">Aakaara Studios NYC</div>
        <a href="/index.html#contact" class="film-cta-link">
          Book a session
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
      </div>
    </div>`;

  // ─── player logic ─────────────────────────────────────────────────────────
  const vid     = document.getElementById('vid');
  const poster  = document.getElementById('poster');
  const bigPlay = document.getElementById('bigPlay');
  const stage   = document.getElementById('stage');
  const playBtn = document.getElementById('playBtn');
  const muteBtn = document.getElementById('muteBtn');
  const fsBtn   = document.getElementById('fsBtn');
  const track   = document.getElementById('progressTrack');
  const fill    = document.getElementById('progressFill');
  const timeEl  = document.getElementById('timeDisplay');

  let started = false;

  function fmt(s) {
    return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  }

  function syncPlay() {
    const paused = vid.paused;
    stage.classList.toggle('is-paused', paused);
    playBtn.innerHTML = paused
      ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>'
      : '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
  }

  function syncMute() {
    muteBtn.innerHTML = vid.muted
      ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93L4.93 19.07"/></svg>'
      : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>';
  }

  function startPlayback() {
    if (started) return;
    started = true;
    poster.classList.add('gone');
    bigPlay.classList.add('gone');
    vid.muted = true;
    syncMute();

    if (vid.canPlayType('application/vnd.apple.mpegurl')) {
      vid.src = film.url;
      vid.load();
      vid.play().catch(() => {});
    } else {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js';
      s.onload = () => {
        if (!Hls.isSupported()) return;
        const hls = new Hls({ maxBufferLength: 60 });
        hls.loadSource(film.url);
        hls.attachMedia(vid);
        hls.on(Hls.Events.MANIFEST_PARSED, () => vid.play().catch(() => {}));
      };
      document.head.appendChild(s);
    }
  }

  // click stage to play/pause; ignore clicks on the controls bar
  stage.addEventListener('click', (e) => {
    if (e.target.closest('#controls')) return;
    if (!started) { startPlayback(); return; }
    vid.paused ? vid.play().catch(() => {}) : vid.pause();
  });

  playBtn.addEventListener('click', () => {
    if (!started) { startPlayback(); return; }
    vid.paused ? vid.play().catch(() => {}) : vid.pause();
  });

  muteBtn.addEventListener('click', () => { vid.muted = !vid.muted; syncMute(); });

  fsBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      (stage.requestFullscreen || stage.webkitRequestFullscreen).call(stage);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }
  });

  // robust progress click: use clientX so child elements don't skew offsetX
  track.addEventListener('click', (e) => {
    if (!vid.duration) return;
    const rect = track.getBoundingClientRect();
    const pct  = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    vid.currentTime = pct * vid.duration;
    track.setAttribute('aria-valuenow', Math.round(pct * 100));
  });

  vid.addEventListener('play',  syncPlay);
  vid.addEventListener('pause', syncPlay);

  vid.addEventListener('timeupdate', () => {
    if (!vid.duration) return;
    const pct = vid.currentTime / vid.duration;
    fill.style.width = `${pct * 100}%`;
    timeEl.textContent = fmt(vid.currentTime);
    track.setAttribute('aria-valuenow', Math.round(pct * 100));
  });

  // keyboard: Space/K play, ←/→ skip 5s, M mute, F fullscreen
  document.addEventListener('keydown', (e) => {
    if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
    const k = e.key;
    if (k === ' ' || k.toLowerCase() === 'k') {
      e.preventDefault();
      if (!started) { startPlayback(); return; }
      vid.paused ? vid.play().catch(() => {}) : vid.pause();
    }
    if (k === 'ArrowLeft'  && vid.duration) vid.currentTime = Math.max(0, vid.currentTime - 5);
    if (k === 'ArrowRight' && vid.duration) vid.currentTime = Math.min(vid.duration, vid.currentTime + 5);
    if (k.toLowerCase() === 'm') { vid.muted = !vid.muted; syncMute(); }
    if (k.toLowerCase() === 'f') fsBtn.click();
  });
}
</script>
</body>
</html>
