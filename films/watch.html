<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --noir:    #09080b;
  --umber:   #1e1a16;
  --rose:    #c9956b;
  --ivory:   #faf6f1;
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-body:    'Outfit', 'Helvetica Neue', sans-serif;
  --ease:    cubic-bezier(0.16, 1, 0.3, 1);
}

html, body {
  height: 100%;
  background: var(--noir);
  color: var(--ivory);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ── GRAIN ── */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
  opacity: 0.028;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 180px 180px;
}

/* ── NAV ── */
.film-nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.25rem 2rem;
  background: linear-gradient(to bottom, rgba(9,8,11,0.88) 0%, transparent 100%);
}

.film-logo {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  text-decoration: none;
  color: var(--ivory);
}

.film-logo svg { width: 34px; height: 34px; flex-shrink: 0; }

.film-logo-text {
  font-family: var(--font-display);
  font-size: 0.92rem;
  font-weight: 300;
  letter-spacing: 0.22em;
  color: var(--ivory);
}

.film-back {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  font-size: 0.48rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(250,246,241,0.38);
  text-decoration: none;
  transition: color 0.3s;
}
.film-back:hover { color: var(--rose); }
.film-back svg { opacity: 0.6; transition: opacity 0.3s; }
.film-back:hover svg { opacity: 1; }

/* ── MAIN ── */
.film-wrap {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 5.5rem 1.5rem 3.5rem;
  gap: 0;
}

/* ── PLAYER ── */
.player-shell {
  width: 100%;
  max-width: 980px;
}

.player-stage {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #0c0a0e;
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
  box-shadow: 0 40px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(250,246,241,0.04);
}

.player-stage video {
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
}

/* poster */
.player-poster {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  background-color: #0c0a0e;
  transition: opacity 0.7s var(--ease);
  z-index: 2;
}
.player-poster.gone { opacity: 0; pointer-events: none; }

/* big play */
.player-big-play {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 3;
  transition: opacity 0.4s;
}
.player-big-play.gone { opacity: 0; pointer-events: none; }

.play-ring {
  width: 76px; height: 76px;
  border-radius: 50%;
  border: 1px solid rgba(201,149,107,0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(9,8,11,0.45);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: transform 0.35s var(--ease), border-color 0.35s, background 0.35s;
}
.play-ring:hover {
  transform: scale(1.1);
  border-color: var(--rose);
  background: rgba(201,149,107,0.14);
}
.play-ring svg { margin-left: 4px; color: var(--ivory); }

/* controls bar */
.player-controls {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  z-index: 4;
  padding: 2.5rem 1.2rem 1rem;
  background: linear-gradient(to top, rgba(9,8,11,0.96) 0%, rgba(9,8,11,0.4) 60%, transparent 100%);
  display: flex;
  align-items: center;
  gap: 0.65rem;
  opacity: 0;
  transition: opacity 0.35s;
}

.player-stage:hover .player-controls,
.player-stage.is-paused .player-controls { opacity: 1; }

.ctrl-btn {
  background: none; border: none;
  color: rgba(250,246,241,0.7);
  cursor: pointer;
  padding: 0.3rem;
  display: flex; align-items: center; justify-content: center;
  transition: color 0.2s;
  min-width: 36px; min-height: 36px;
  flex-shrink: 0;
}
.ctrl-btn:hover { color: var(--rose); }

.progress-track {
  flex: 1;
  height: 2px;
  background: rgba(250,246,241,0.12);
  border-radius: 2px;
  cursor: pointer;
  position: relative;
  padding: 8px 0;
  margin: -8px 0;
}
.progress-fill {
  height: 2px;
  background: var(--rose);
  border-radius: 2px;
  width: 0%;
  pointer-events: none;
  position: relative;
  top: 0;
}
.progress-track:hover .progress-fill { height: 3px; margin-top: -0.5px; }

.time-display {
  font-size: 0.58rem;
  color: rgba(250,246,241,0.42);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.05em;
  min-width: 38px;
  text-align: right;
  flex-shrink: 0;
}

/* ── INFO ── */
.film-info {
  width: 100%;
  max-width: 980px;
  margin-top: 1.75rem;
  padding: 0 0.25rem;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.film-category {
  font-size: 0.46rem;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--rose);
  margin-bottom: 0.1rem;
}

.film-title {
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 3.5vw, 2.1rem);
  font-weight: 300;
  color: var(--ivory);
  letter-spacing: 0.02em;
  line-height: 1.15;
}

.film-type {
  font-size: 0.48rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(250,246,241,0.3);
}

.film-rule {
  width: 36px;
  height: 1px;
  background: rgba(201,149,107,0.25);
  margin: 0.9rem 0 0.7rem;
}

.film-studio {
  font-size: 0.44rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: rgba(250,246,241,0.18);
}

/* ── NOT FOUND ── */
.not-found {
  text-align: center;
  padding: 3rem 2rem;
  max-width: 480px;
}
.not-found h2 {
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 300;
  color: var(--ivory);
  letter-spacing: 0.02em;
  margin-bottom: 0.75rem;
}
.not-found p {
  font-size: 0.82rem;
  color: rgba(250,246,241,0.38);
  line-height: 1.7;
  margin-bottom: 2rem;
}
.not-found a {
  font-size: 0.48rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--rose);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}

/* ── MOBILE ── */
@media (max-width: 768px) {
  .film-nav { padding: 1rem 1.25rem; }
  .film-logo-text { display: none; }
  .film-wrap { padding: 4rem 0 2.5rem; }
  .player-stage { border-radius: 0; box-shadow: none; }
  .film-info { padding: 0 1.25rem; margin-top: 1.25rem; }
  .play-ring { width: 62px; height: 62px; }
}
</style>

  const stage    = document.getElementById('stage');

  let hlsInstance = null;

  function fmt(s) {

    return `${m}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

  function syncMute() {
    muteBtn.innerHTML = vid.muted
      ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93L4.93 19.07"/></svg>'
      : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>';
  }

  function startPlayback() {
    if (started) return;
    started = true;
    poster.classList.add('gone');
    bigPlay.classList.add('gone');
    vid.muted = true;
    syncMute();

    if (vid.canPlayType('application/vnd.apple.mpegurl')) {
      vid.src = film.url;
      vid.load();
      vid.play().catch(() => {});
    } else {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js';
      s.onload = () => {
        if (!Hls.isSupported()) return;
        hlsInstance = new Hls({ maxBufferLength: 60 });
        hlsInstance.loadSource(film.url);
        hlsInstance.attachMedia(vid);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => vid.play().catch(() => {}));
      };
      document.head.appendChild(s);
    }
  }

  // Click anywhere on stage to play/pause (but not on controls)
  stage.addEventListener('click', (e) => {
    if (e.target.closest('#controls')) return;
    if (!started) { startPlayback(); return; }
    vid.paused ? vid.play().catch(() => {}) : vid.pause();
  });

  playBtn.addEventListener('click', () => {
    if (!started) { startPlayback(); return; }
    vid.paused ? vid.play().catch(() => {}) : vid.pause();
  });

  muteBtn.addEventListener('click', () => { vid.muted = !vid.muted; syncMute(); });

  fsBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      (stage.requestFullscreen || stage.webkitRequestFullscreen).call(stage);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }
  });

  track.addEventListener('click', (e) => {
    if (!vid.duration) return;
    const pct = e.offsetX / track.offsetWidth;
    vid.currentTime = pct * vid.duration;
    track.setAttribute('aria-valuenow', Math.round(pct * 100));
  });

  vid.addEventListener('play',  syncPlay);
  vid.addEventListener('pause', syncPlay);

  vid.addEventListener('timeupdate', () => {
    if (!vid.duration) return;
    const pct = (vid.currentTime / vid.duration) * 100;
    fill.style.width = `${pct}%`;
    timeEl.textContent = fmt(vid.currentTime);
    track.setAttribute('aria-valuenow', Math.round(pct));
  });

  // Keyboard shortcuts (Space/K = play, ←/→ = skip 5s, M = mute, F = fullscreen)
  document.addEventListener('keydown', (e) => {
    if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
    if (e.key === ' ' || e.key.toLowerCase() === 'k') {
      e.preventDefault();
      if (!started) { startPlayback(); return; }
      vid.paused ? vid.play().catch(() => {}) : vid.pause();
    }
    if (e.key === 'ArrowLeft'  && vid.duration) vid.currentTime = Math.max(0, vid.currentTime - 5);
    if (e.key === 'ArrowRight' && vid.duration) vid.currentTime = Math.min(vid.duration, vid.currentTime + 5);
    if (e.key.toLowerCase() === 'm') { vid.muted = !vid.muted; syncMute(); }
    if (e.key.toLowerCase() === 'f') fsBtn.click();
  });
}
</script>
</body>
</html>
