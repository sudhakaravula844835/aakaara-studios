<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote Generator — Aakaara Studios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/themes/dark.css" integrity="sha384-heUUtXw0Djj2DElfLOVPlASSWFKNL3JDY6s3FEqQD03GYyWOeophY5DsfEG40sYX" crossorigin="anonymous">
  <link rel="stylesheet" href="quote-generator.css">
</head>
<body>

<div id="topbar">
  <div class="topbar-brand">Aakaara Studios</div>
  <div class="topbar-center">
    <span class="topbar-ref" id="quoteRefDisplay"></span>
    <span class="topbar-saved" id="draftIndicator">Draft saved</span>
  </div>
  <div class="topbar-actions">
    <button type="button" id="newQuoteBtn">New Quote</button>
    <button type="button" id="dashboardBtn">Dashboard</button>
    <button type="button" id="topbarPreviewBtn" class="btn-gold">Preview PDF</button>
  </div>
</div>

<main id="qgMain">

  <section id="sectionClient" class="qg-section">
    <h2 class="section-label">01 — Client Information</h2>

    <div class="quick-import-card">
      <label class="field-label" for="quickImportText">Quick Import — paste brief text</label>
      <textarea id="quickImportText" rows="3" placeholder="Paste client details, dates, event names…"></textarea>
      <button type="button" id="importBtn" class="btn-ghost">Import</button>
      <div id="importStatus" class="import-status"></div>
    </div>

    <div class="field-row field-row-3">
      <div class="field-group">
        <label class="field-label" for="clientName">Client Name(s)</label>
        <input type="text" id="clientName" autocomplete="name">
      </div>
      <div class="field-group">
        <label class="field-label" for="clientEmail">Email</label>
        <input type="email" id="clientEmail" autocomplete="email">
      </div>
      <div class="field-group">
        <label class="field-label" for="clientPhone">Phone</label>
        <input type="tel" id="clientPhone" inputmode="tel" autocomplete="tel">
      </div>
    </div>

    <div class="field-row field-row-3">
      <div class="field-group">
        <label class="field-label" for="eventType">Event Type</label>
        <select id="eventType">
          <option value="">Select…</option>
          <option value="Wedding">Wedding</option>
          <option value="Engagement">Engagement</option>
          <option value="Portrait">Portrait</option>
          <option value="Maternity">Maternity</option>
          <option value="Newborn">Newborn</option>
          <option value="Family">Family</option>
          <option value="Corporate">Corporate</option>
          <option value="Event">Event</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="field-group">
        <label class="field-label" for="venueName">Venue / Location</label>
        <input type="text" id="venueName" autocomplete="off" placeholder="The Pierre Hotel">
      </div>
      <div class="field-group">
        <label class="field-label" for="location">City</label>
        <input type="text" id="location" autocomplete="off">
      </div>
    </div>

    <div class="field-row field-row-3">
      <div class="field-group">
        <label class="field-label" for="quoteDate">Quote Date</label>
        <input type="date" id="quoteDate">
      </div>
      <div class="field-group">
        <label class="field-label" for="quoteRef">Reference #</label>
        <input type="text" id="quoteRef" placeholder="AAS-2026-001">
      </div>
      <div class="field-group">
        <label class="field-label" for="referralSource">Referred By</label>
        <select id="referralSource">
          <option value="">Select…</option>
          <option value="Instagram">Instagram</option>
          <option value="Google">Google</option>
          <option value="Referral">Referral</option>
          <option value="Wedding Wire">Wedding Wire</option>
          <option value="The Knot">The Knot</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>
  </section>

  <section id="sectionSchedule" class="qg-section">
    <h2 class="section-label">02 — Event Schedule</h2>
    <div id="daysContainer"></div>
    <button type="button" id="addDayBtn" class="btn-ghost">+ Add Day</button>
  </section>

  <section id="sectionDeliverables" class="qg-section">
    <h2 class="section-label">03 — Deliverables</h2>

    <div class="deliverables-grid">
      <label class="del-check"><input type="checkbox" id="delEdited"> Edited Photos</label>
      <label class="del-check"><input type="checkbox" id="delRaw"> Raw Images</label>
      <label class="del-check"><input type="checkbox" id="delGallery"> Online Gallery</label>
      <label class="del-check"><input type="checkbox" id="delSneakPeek"> Sneak Peek (48hr)</label>
      <label class="del-check"><input type="checkbox" id="delTeaser"> Teaser Reel</label>
      <label class="del-check"><input type="checkbox" id="delDoc"> Documentary Video</label>
      <label class="del-check"><input type="checkbox" id="delTraditional"> Traditional Video</label>
      <label class="del-check"><input type="checkbox" id="delHighlight"> Highlight Video</label>
      <label class="del-check"><input type="checkbox" id="delDrone"> Drone Coverage</label>
      <label class="del-check"><input type="checkbox" id="delLive"> Livestream</label>
      <label class="del-check"><input type="checkbox" id="delSecondShooter"> Second Shooter</label>
    </div>

    <div class="addon-card">
      <div class="addon-card-label">Add-ons &amp; Upgrades</div>

      <div class="addon-row">
        <label class="del-check"><input type="checkbox" id="delEngagement"> Engagement / Pre-Wedding Session</label>
        <input type="text" id="delEngagementNotes" class="addon-notes hidden" placeholder="Session details…">
      </div>

      <div class="addon-row">
        <label class="del-check"><input type="checkbox" id="delAddlHours"> Additional Hours</label>
        <div class="addon-rate hidden" id="delAddlHoursRateWrap">
          <span>Overtime rate</span>
          <input type="number" id="delAddlHoursRate" inputmode="decimal" min="0" step="25" placeholder="0">
          <span>$/hr</span>
        </div>
      </div>

      <div class="addon-row">
        <label class="del-check"><input type="checkbox" id="delRush"> Rush / Priority Delivery</label>
        <div class="addon-rate hidden" id="delRushFeeWrap">
          <span>Rush fee</span>
          <input type="number" id="delRushFee" inputmode="decimal" min="0" step="50" placeholder="0">
          <span>$</span>
        </div>
      </div>
    </div>

    <div class="field-row field-row-2" style="margin-top:16px;">
      <div class="field-group">
        <label class="field-label" for="timeline">Delivery Timeline</label>
        <input type="text" id="timeline" placeholder="6–8 weeks after event">
      </div>
      <div class="field-group">
        <label class="field-label" for="customNotes">Custom Deliverable Notes</label>
        <textarea id="customNotes" rows="2" placeholder="Any custom items…"></textarea>
      </div>
    </div>
  </section>

  <section id="sectionPricing" class="qg-section">
    <h2 class="section-label">04 — Pricing</h2>

    <div class="field-row field-row-2">
      <div class="field-group">
        <label class="field-label" for="pricingModel">Pricing Model</label>
        <select id="pricingModel">
          <option value="hourly">Hourly Rate</option>
          <option value="flat">Package / Flat Rate</option>
        </select>
      </div>
      <div class="field-group" id="hourlyRateGroup">
        <label class="field-label" for="hourlyRate">Hourly Rate ($)</label>
        <input type="number" id="hourlyRate" inputmode="decimal" min="0" step="25">
      </div>
      <div class="field-group hidden" id="flatRateGroup">
        <label class="field-label" for="flatRate">Package Price ($)</label>
        <input type="number" id="flatRate" inputmode="decimal" min="0" step="100">
      </div>
    </div>

    <div class="field-row field-row-2">
      <div class="field-group">
        <label class="field-label" for="travelType">Travel &amp; Accommodation</label>
        <select id="travelType">
          <option value="none">Not Applicable</option>
          <option value="fixed">Fixed Amount</option>
          <option value="separate">Billed Separately</option>
          <option value="included">Included</option>
        </select>
      </div>
      <div class="field-group hidden" id="travelAmountGroup">
        <label class="field-label" for="travelAmount">Travel Amount ($)</label>
        <input type="number" id="travelAmount" inputmode="decimal" min="0" step="50">
      </div>
    </div>

    <div class="field-row field-row-2">
      <div class="field-group">
        <label class="field-label" for="retainerFee">Retainer / Booking Fee ($)</label>
        <input type="number" id="retainerFee" inputmode="decimal" min="0" step="100" placeholder="Optional">
      </div>
      <div class="field-group">
        <label class="field-label intro-label">
          <input type="checkbox" id="showIntro"> Show as Introductory Rate
        </label>
        <input type="text" id="standardRate" class="hidden" placeholder="Standard Rate (e.g. $3,500)">
      </div>
    </div>

    <div id="pricingPreview" class="pricing-preview"></div>
  </section>

  <section id="sectionTerms" class="qg-section">
    <h2 class="section-label">05 — Additional Terms</h2>

    <div class="field-row field-row-3">
      <div class="field-group">
        <label class="field-label" for="deposit">Deposit Requirement</label>
        <input type="text" id="deposit" placeholder="50% to secure the date">
      </div>
      <div class="field-group">
        <label class="field-label" for="validity">Quote Validity</label>
        <input type="text" id="validity" placeholder="Valid for 14 days">
      </div>
      <div class="field-group">
        <label class="field-label" for="balanceDue">Balance Due Date</label>
        <input type="text" id="balanceDue" placeholder="30 days before event">
      </div>
    </div>

    <div class="field-group" style="margin-top:12px;">
      <label class="field-label" for="extraNotes">Extra Notes</label>
      <textarea id="extraNotes" rows="3" placeholder="Any other terms or notes for the client…">Data Handling & Delivery: Client to provide two external hard disks (1–2TB capacity each) before the wedding date — one for the photography team to use for on-site data backup, and a second for RAW data delivery. Both drives formatted in exFAT for cross-platform compatibility. Photography team will return the RAW data drive to the client within one week of the event. Client assumes responsibility for drives once handed over for data transfer.</textarea>
    </div>
  </section>

</main>

<div id="generateBar">
  <div class="gen-bar-total">
    <div class="gen-bar-label">Estimated Total</div>
    <div id="totalDisplay" class="gen-bar-amount">$0</div>
    <div id="totalMeta" class="gen-bar-meta"></div>
  </div>
  <div class="gen-bar-actions">
    <button type="button" id="resetBtn">Reset</button>
    <button type="button" id="previewBtn" class="btn-gold">Preview Quote</button>
  </div>
</div>

<div id="previewModal" class="hidden">
  <div class="preview-overlay" id="previewOverlay"></div>
  <div class="preview-container">
    <div class="preview-header">
      <span>Quote Preview</span>
      <div class="preview-header-actions">
        <button type="button" id="confirmSendBtn" class="btn-gold">Confirm &amp; Send</button>
        <button type="button" id="closePreviewBtn">Close</button>
      </div>
    </div>
    <iframe id="previewFrame" title="Quote PDF Preview"></iframe>
  </div>
</div>

<template id="dayTemplate">
  <div class="day-block" data-day-id="">
    <div class="day-header">
      <span class="day-label"></span>
      <button type="button" class="day-remove btn-ghost-sm" data-action="removeDay">Remove</button>
    </div>
    <div class="field-row field-row-2 day-meta-row">
      <div class="field-group">
        <label class="field-label">Date</label>
        <input type="date" data-field="date">
      </div>
      <div class="field-group">
        <label class="field-label">Total Hours</label>
        <input type="number" data-field="hours" inputmode="decimal" min="0" step="0.5" placeholder="Auto">
      </div>
    </div>
    <div class="events-container"></div>
    <div class="day-footer">
      <span class="day-photo-total"></span>
      <button type="button" class="btn-ghost-sm" data-action="addEvent">+ Add Event</button>
    </div>
  </div>
</template>

<template id="eventTemplate">
  <div class="event-item" data-event-item>
    <div class="event-num"></div>
    <div class="event-fields">
      <div class="field-group">
        <label class="field-label">Name</label>
        <input type="text" data-field="eventName">
      </div>
      <div class="field-group">
        <label class="field-label">Duration</label>
        <input type="text" data-field="eventDuration" placeholder="e.g. 3 Hours">
      </div>
      <div class="field-group">
        <label class="field-label">Photos</label>
        <input type="number" data-field="eventPhotos" inputmode="decimal" min="0" step="10" placeholder="Optional">
      </div>
      <div class="field-group">
        <label class="field-label">Notes</label>
        <input type="text" data-field="eventNotes">
      </div>
    </div>
    <button type="button" class="event-remove btn-icon" data-action="removeEvent" aria-label="Remove event">x</button>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js" integrity="sha384-5JqMv4L/Xa0hfvtF06qboNdhvuYXUku9ZrhZh3bSk8VXF0A/RuSLHpLsSV9Zqhl6" crossorigin="anonymous"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/cormorant-fonts.js"></script>
<script type="module" src="quote-generator.js"></script>
</body>
</html>
