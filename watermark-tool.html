<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aakaara — Watermark Tool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<link rel="stylesheet" href="https://use.typekit.net/uyl0arj.css">
<style>
  :root { --bg: #0a0a0a; --surface: #111; --gold: #c9956b; --text: #f0ebe4; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 2rem; }
  h1 { font-family: 'Cormorant Garamond', serif; font-weight: 300; color: var(--gold); margin-bottom: 0.5rem; }
  .drop-zone {
    width: 100%; max-width: 600px; height: 200px;
    border: 2px dashed rgba(201,149,107,0.3); border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--surface); transition: all 0.3s; cursor: pointer; margin-bottom: 2rem;
  }
  .drop-zone:hover, .drop-zone.dragover { border-color: var(--gold); background: rgba(201,149,107,0.05); }
  .btn {
    background: var(--gold); color: #000; border: none; padding: 12px 24px;
    border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 1rem;
    font-family: inherit; transition: transform 0.2s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; background: #333; color: #666; }
  #previewGrid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 1rem; width: 100%; max-width: 1000px; margin-bottom: 2rem;
  }
  .preview-card { position: relative; aspect-ratio: 4/5; background: #222; border-radius: 4px; overflow: hidden; }
  .preview-card img { width: 100%; height: 100%; object-fit: cover; }
  .status { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); font-size: 0.7rem; padding: 4px; text-align: center; }
  .controls { display: flex; gap: 1.5rem; margin-bottom: 2rem; flex-wrap: wrap; align-items: center; }
  .radio-btn { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text); font-size: 0.9rem; }
  .radio-btn input { appearance: none; width: 16px; height: 16px; border: 1px solid var(--gold); border-radius: 50%; display: grid; place-content: center; }
  .radio-btn input::before { content: ""; width: 8px; height: 8px; border-radius: 50%; transform: scale(0); transition: 0.2s transform; background: var(--gold); }
  .radio-btn input:checked::before { transform: scale(1); }
  .radio-btn span { opacity: 0.8; transition: opacity 0.2s; }
  .radio-btn:hover span { opacity: 1; }
  .slider-group { display: flex; align-items: center; gap: 0.8rem; margin-left: auto; }
  .slider-group label { font-size: 0.85rem; color: rgba(255,255,255,0.6); min-width: 90px; }
  .slider-group input { width: 140px; accent-color: var(--gold); cursor: pointer; }
  .control-select { background: #222; color: var(--text); border: 1px solid rgba(201,149,107,0.3); padding: 4px 8px; border-radius: 4px; font-family: inherit; font-size: 0.8rem; outline: none; cursor: pointer; }
  .control-select:focus { border-color: var(--gold); }
  @media (max-width: 600px) { .slider-group { margin-left: 0; width: 100%; } .slider-group input { flex: 1; } }
</style>
</head>
<body>

<h1>Watermark Studio</h1>
<p style="opacity:0.6;margin-bottom:2rem;">Drag & drop images to apply the Aakaara watermark automatically.</p>

<div class="drop-zone" id="dropZone">
  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#c9956b" stroke-width="1.5" style="margin-bottom:1rem"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
  <span>Drop images here or click to upload</span>
  <input type="file" id="fileInput" multiple accept="image/*" style="display:none">
</div>

<div class="controls">
  <label class="radio-btn">
    <input type="radio" name="wmColor" value="white" checked onchange="reprocessAll()">
    <span>White Watermark</span>
  </label>
  <label class="radio-btn">
    <input type="radio" name="wmColor" value="gold" onchange="reprocessAll()">
    <span>Gold Watermark</span>
  </label>
  <div class="slider-group">
    <label>Size: <span id="sizeVal" style="color:var(--gold)">30%</span></label>
    <input type="range" id="wmSize" min="10" max="90" value="30" oninput="updateLabels()" onchange="reprocessAll()">
  </div>
  <div class="slider-group">
    <label>Opacity: <span id="opacityVal" style="color:var(--gold)">50%</span></label>
    <input type="range" id="wmOpacity" min="5" max="100" value="50" oninput="updateLabels()" onchange="reprocessAll()">
  </div>
  <div class="slider-group" style="margin-left:0">
    <label style="min-width:auto;margin-right:0.5rem">Position:</label>
    <select id="wmPosition" class="control-select" onchange="reprocessAll()">
      <option value="tl" selected>Top Left</option>
      <option value="tr">Top Right</option>
      <option value="bl">Bottom Left</option>
      <option value="br">Bottom Right</option>
      <option value="c">Center</option>
    </select>
  </div>
  <button class="btn btn-ghost btn-small" onclick="clearAll()" style="margin-left:auto;padding:8px 16px;font-size:0.75rem;">Clear All</button>
</div>

<div id="previewGrid"></div>

<button id="downloadBtn" class="btn" disabled>Download All (ZIP)</button>

<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const previewGrid = document.getElementById('previewGrid');
  const downloadBtn = document.getElementById('downloadBtn');
  
  let processedImages = [];
  let currentFiles = [];
  const WM_URLS = {
    white: 'watermark/aakaara-watermark-white.png',
    gold: 'watermark/aakaara-watermark-gold.png'
  };

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault(); dropZone.classList.remove('dragover');
    handleFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

  function handleFiles(files) {
    for (const file of files) {
      if (file.type.startsWith('image/')) currentFiles.push(file);
    }
    reprocessAll();
  }

  function clearAll() {
    currentFiles = [];
    processedImages = [];
    previewGrid.innerHTML = '';
    downloadBtn.disabled = true;
    downloadBtn.textContent = 'Download All (ZIP)';
  }

  function updateLabels() {
    document.getElementById('opacityVal').textContent = document.getElementById('wmOpacity').value + '%';
    document.getElementById('sizeVal').textContent = document.getElementById('wmSize').value + '%';
  }

  async function reprocessAll() {
    previewGrid.innerHTML = '';
    processedImages = [];
    downloadBtn.disabled = true;
    downloadBtn.textContent = 'Processing...';
    
    const color = document.querySelector('input[name="wmColor"]:checked').value;
    const opacity = document.getElementById('wmOpacity').value / 100;
    const size = document.getElementById('wmSize').value / 100;
    const pos = document.getElementById('wmPosition').value;
    const wmImg = new Image();
    wmImg.src = WM_URLS[color];
    await new Promise(r => wmImg.onload = r);

    for (const file of currentFiles) {
      const card = document.createElement('div');
      card.className = 'preview-card';
      card.innerHTML = '<div class="status">Processing...</div>';
      previewGrid.appendChild(card);

      try {
        const blob = await processImage(file, wmImg, opacity, size, pos);
        const url = URL.createObjectURL(blob);
        card.innerHTML = `<img src="${url}"><div class="status" style="color:#4ade80">Ready</div>`;
        processedImages.push({ name: file.name, blob: blob });
      } catch (err) {
        card.innerHTML = `<div class="status" style="color:#ef4444">Error</div>`;
        console.error(err);
      }
    }

    if (processedImages.length > 0) {
      downloadBtn.disabled = false;
      downloadBtn.textContent = `Download ${processedImages.length} Images (ZIP)`;
    }
  }

  function processImage(file, wmImg, opacity = 0.5, sizePct = 0.3, position = 'tl') {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        
        // Resize logic (optional: limit max width to 2000px for web)
        const MAX_W = 2000;
        let w = img.width, h = img.height;
        if (w > MAX_W) { h = h * (MAX_W / w); w = MAX_W; }
        
        canvas.width = w;
        canvas.height = h;
        
        // Draw Photo
        ctx.drawImage(img, 0, 0, w, h);
        
        // Draw Watermark
        const wmScale = (w * sizePct) / wmImg.width;
        const wmW = w * sizePct;
        const wmH = wmImg.height * wmScale;
        const pad = w * 0.05;
        let wmX, wmY;

        if (position === 'tl') { wmX = pad; wmY = pad; }
        else if (position === 'tr') { wmX = w - wmW - pad; wmY = pad; }
        else if (position === 'bl') { wmX = pad; wmY = h - wmH - pad; }
        else if (position === 'br') { wmX = w - wmW - pad; wmY = h - wmH - pad; }
        else if (position === 'c') { wmX = (w - wmW) / 2; wmY = (h - wmH) / 2; }
        
        ctx.globalAlpha = opacity;
        ctx.drawImage(wmImg, wmX, wmY, wmW, wmH);
        
        canvas.toBlob(resolve, 'image/jpeg', 0.9);
      };
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }

  downloadBtn.addEventListener('click', async () => {
    const zip = new JSZip();
    processedImages.forEach(img => {
      zip.file("watermarked_" + img.name, img.blob);
    });
    const content = await zip.generateAsync({type:"blob"});
    saveAs(content, "aakaara_watermarked.zip");
  });
</script>
</body>
</html>
